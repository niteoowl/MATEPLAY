<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writer Pro - No Distractions</title>
    <style>
        :root { --word-blue: #2b579a; --border: #ccc; }
        body, html { margin: 0; padding: 0; height: 100%; background: #e6e6e6; font-family: sans-serif; }
        
        /* Ribbon UI */
        .ribbon { background: #f3f2f1; border-bottom: 2px solid var(--word-blue); position: sticky; top: 0; z-index: 1000; padding: 5px; }
        .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; max-width: 1200px; margin: 0 auto; }
        
        .group { display: flex; align-items: center; gap: 4px; background: white; padding: 4px 8px; border-radius: 4px; border: 1px solid #ddd; }
        .btn { border: 1px solid transparent; background: transparent; padding: 6px 10px; cursor: pointer; font-size: 14px; border-radius: 3px; transition: 0.2s; }
        .btn:hover { background: #e1e1e1; border-color: #bbb; }
        
        select { padding: 4px; border: 1px solid #ddd; border-radius: 3px; outline: none; }

        /* Canvas */
        .viewport { height: calc(100vh - 80px); overflow-y: auto; padding: 30px 10px; display: flex; flex-direction: column; align-items: center; }
        .paper { 
            background: white; width: 100%; max-width: 210mm; min-height: 297mm;
            padding: 2.54cm; box-shadow: 0 0 15px rgba(0,0,0,0.1); outline: none;
            box-sizing: border-box; word-wrap: break-word; font-size: 11pt; line-height: 1.6;
        }

        /* 표 스타일 강제 지정 */
        table { border-collapse: collapse; width: 100%; margin: 10px 0; }
        table, td { border: 1px solid #444; padding: 8px; }
        img { max-width: 100%; height: auto; display: block; margin: 10px 0; }
        
        /* 모바일 대응 */
        @media (max-width: 768px) { .paper { padding: 1cm; } .toolbar { overflow-x: auto; white-space: nowrap; } }
    </style>
</head>
<body>

<div class="ribbon">
    <div class="toolbar">
        <div class="group">
            <select id="fontName" onchange="exec('fontName', this.value)">
                <option value="Gulim">굴림</option>
                <option value="Batang">바탕</option>
                <option value="Dotum">돋움</option>
                <option value="Malgun Gothic" selected>맑은 고딕</option>
                <option value="Arial">Arial</option>
            </select>
            <select id="fontSize" onchange="exec('fontSize', this.value)">
                <option value="2">9pt</option>
                <option value="3" selected>11pt</option>
                <option value="4">14pt</option>
                <option value="5">18pt</option>
                <option value="6">24pt</option>
            </select>
        </div>

        <div class="group">
            <button class="btn" onclick="exec('bold')"><b>B</b></button>
            <button class="btn" onclick="exec('italic')"><i>I</i></button>
            <button class="btn" onclick="exec('underline')"><u>U</u></button>
            <input type="color" onchange="exec('foreColor', this.value)" title="글자색">
        </div>

        <div class="group">
            <button class="btn" onclick="insertTable()">📅 표 삽입</button>
            <button class="btn" onclick="document.getElementById('imgInput').click()">🖼 사진</button>
            <input type="file" id="imgInput" hidden accept="image/*" onchange="insertImage(this)">
        </div>

        <div class="group">
            <button class="btn" style="background:#ffcc00" onclick="toggleFullScreen()">📺 전체화면</button>
            <button class="btn" style="background:#2b579a; color:white;" onclick="downloadDoc()">💾 저장</button>
        </div>
    </div>
</div>

<div class="viewport">
    <div id="editor" class="paper" contenteditable="true" spellcheck="false">
        <h1>제목을 입력하세요</h1>
        <p>글을 작성해 보세요. 이미지를 끌어다 놓거나(드래그 앤 드롭) 표를 삽입할 수 있습니다.</p>
    </div>
</div>

<script>
    function exec(cmd, val = null) {
        document.execCommand(cmd, false, val);
        document.getElementById('editor').focus();
    }

    // 표 삽입 (행/열 입력받음)
    function insertTable() {
        const rows = prompt("행 개수:", "3");
        const cols = prompt("열 개수:", "3");
        if (rows && cols) {
            let table = `<table>`;
            for (let i = 0; i < rows; i++) {
                table += "<tr>";
                for (let j = 0; j < cols; j++) table += "<td>&nbsp;</td>";
                table += "</tr>";
            }
            table += "</table><p>&nbsp;</p>";
            exec('insertHTML', table);
        }
    }

    // 이미지 삽입
    function insertImage(input) {
        const file = input.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => exec('insertImage', e.target.result);
            reader.readAsDataURL(file);
        }
    }

    // 파일로 저장 (HTML 방식)
    function downloadDoc() {
        const content = document.getElementById('editor').innerHTML;
        const blob = new Blob(['<html><body style="font-family:Malgun Gothic">' + content + '</body></html>'], {type: 'text/html'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'document.html';
        a.click();
    }

    function toggleFullScreen() {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
    }

    // 드래그 앤 드롭 이미지 지원
    const editor = document.getElementById('editor');
    editor.addEventListener('drop', (e) => {
        e.preventDefault();
        const file = e.dataTransfer.files[0];
        if (file && file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = (ev) => exec('insertImage', ev.target.result);
            reader.readAsDataURL(file);
        }
    });
</script>
</body>
</html>
