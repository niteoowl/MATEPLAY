<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>MatePlay — 로그인/회원가입</title>
  <style>
    :root{
      --bg:#0f1115; --panel:#151823; --panel-2:#1b2030;
      --accent:#1ed760; --muted:#9aa7c2; --text:#eef2ff; --danger:#ff5d5d; --focus:#2dd4bf;
      --shadow:0 12px 28px rgba(0,0,0,.38);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; 
      background:var(--bg); /* 배경 제거 (단색으로 변경) */
      color:var(--text); font-family:-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Apple SD Gothic Neo, Noto Sans KR, sans-serif;
      display:grid; place-items:center; 
      padding:0; /* body padding 제거 */
    }
    .card{
      width:min(460px, 96vw); 
      background:transparent; /* 박스 배경 제거 */
      border:none; /* 테두리 제거 */
      border-radius:0; /* 둥근 모서리 제거 */
      box-shadow:none; /* 그림자 제거 */
      padding:18px; 
    }
    .appbar{
      display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;
      padding-bottom:8px; border-bottom:1px solid rgba(255,255,255,0.06);
    }
    .brand{
        display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:.2px;
    }
    .badge{ font-size:11px; padding:2px 8px; border-radius:999px; background:var(--panel-2); color:var(--muted);
      border:1px solid rgba(255,255,255,0.06);}
    .tabs{
      display:flex; gap:6px; margin:12px 0 8px;
    }
    .tab{
      flex:1; text-align:center; padding:10px 12px; border-radius:12px;
      background:#151a27; color:#cbd5f1; border:1px solid rgba(255,255,255,0.06);
      cursor:pointer; user-select:none; font-weight:700;
    }
    .tab.active{ background:#1ed76022; color:#ffffff; border-color:#1ed76055 }
    .form{
      display:grid; gap:10px; margin-top:6px;
    }
    .field{
      display:grid; gap:8px;
    }
    .label{ font-size:13px; color:#cfd7f5; font-weight:700 }
    .input{
      display:flex; align-items:center; gap:8px; background:#111827; border:1px solid rgba(255,255,255,0.08);
      border-radius:12px; padding:12px 12px;
    }
    .input input{
      flex:1; border:none; outline:none; background:transparent; color:var(--text); font-size:14px;
    }
    .input:focus-within{ border-color: var(--focus); box-shadow:0 0 0 3px #2dd4bf22 }
    .help{ font-size:12px; color:#9fb2d6 }
    .err{ font-size:12px; color:var(--danger) }
    .row{ display:flex; align-items:center; justify-content:flex-start; gap:10px }
    .check{ display:flex; align-items:center; gap:8px; color:#b9c6e4; font-size:13px }
    .btn{
      width:100%; padding:12px 14px; border:none; border-radius:12px; cursor:pointer;
      background:var(--accent); color:#0a0d12; font-weight:900; box-shadow:var(--shadow);
      /* 스피너 위치 조정을 위한 설정 */
      min-height: 44px; 
      position: relative; 
      display: flex; 
      align-items: center; 
      justify-content: center; /* 텍스트를 중앙에 배치 */
    }
    .btn.secondary{
      background:#232a3d; color:#e6ecff; border:1px solid rgba(255,255,255,0.06); box-shadow:none;
    }
    .btn.google{
      display:flex; align-items:center; justify-content:center; gap:8px;
      background:#ffffff; color:#111827; font-weight:800;
      min-height: 44px; /* Google 버튼도 min-height 고정 */
    }
    .sep{
      display:flex; align-items:center; gap:8px; color:#a7b5d6; font-size:12px; margin:2px 0;
    }
    .sep::before, .sep::after{ content:''; flex:1; height:1px; background:rgba(255,255,255,0.1) }
    .hint{ color:#9fb2d6; font-size:12px; margin-top:4px }
    /* 푸터 삭제 */
    .spinner{
      width:18px; height:18px; border:3px solid rgba(255,255,255,.15); border-top-color:#fff; border-radius:50%;
      animation:spin 1s linear infinite;
      
      /* 스피너 위치 조정 */
      position: absolute; 
      left: 14px; /* 버튼 좌측 패딩(14px)에 맞춰 배치 */
      top: 50%;
      transform: translateY(-50%);
    }
    .spinner.hidden{
        display: none;
    }
    @keyframes spin{ to{ transform:rotate(360deg) } }
    .toast{
      position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
      background:#0b1020; color:#d8e4ff; border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:10px 12px; font-size:12px;
      box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:100;
    }
    .toast.show{ opacity:1 }
  </style>
  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { 
        getAuth, 
        createUserWithEmailAndPassword, 
        signInWithEmailAndPassword, 
        signOut, 
        onAuthStateChanged,
        GoogleAuthProvider, // Google 인증 제공자
        signInWithPopup // 팝업 인증
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    window.firebaseModules = { 
        initializeApp, 
        getAuth, 
        createUserWithEmailAndPassword, 
        signInWithEmailAndPassword, 
        signOut, 
        onAuthStateChanged,
        GoogleAuthProvider,
        signInWithPopup
    };
  </script>
</head>
<body>
  <div class="card">
    <div class="appbar">
      <div class="brand">
        <!-- MatePlay 텍스트와 🎧 이모지를 로고 이미지로 교체 -->
        <img src="https://i.postimg.cc/430bTY3C/image.png" alt="MatePlay Logo" style="height: 30px; object-fit: contain;"/>
        <div class="badge">인증</div>
      </div>
      <a href="#" style="color:#a7b5d6; font-size:12px; text-decoration:none" onclick="toast('홈으로 이동하는 기능을 여기에 추가해야 합니다.'); return false;">홈으로</a>
    </div>

    <!-- 로그인/회원가입 탭 -->
    <div class="tabs" id="authTabs">
      <div id="tabLogin" class="tab active">로그인</div>
      <div id="tabSignup" class="tab">회원가입</div>
    </div>

    <!-- 사용자 상태 표시 (로그인 성공 시) -->
    <div id="authState" style="display:none; padding:18px; text-align:center; color:#cfd7f5; background:var(--panel-2); border-radius:12px; margin-top:12px;">
        <div id="authEmail" style="font-size:16px; font-weight:700; margin-bottom:4px;"></div>
        <div id="authUID" style="font-size:12px; color:var(--muted); margin-bottom:12px;"></div>
        <button id="btnLogout" class="btn secondary" style="width:auto; padding:10px 20px;">로그아웃</button>
    </div>

    <!-- 로그인 폼 -->
    <form id="formLogin" class="form" novalidate>
      <div class="field">
        <div class="label">이메일</div>
        <div class="input"><input id="loginEmail" type="email" placeholder="you@example.com" required /></div>
        <div id="loginEmailErr" class="err" style="display:none"></div>
      </div>
      <div class="field">
        <div class="label">비밀번호</div>
        <div class="input"><input id="loginPassword" type="password" placeholder="8자 이상" minlength="6" required /></div>
        <div id="loginPasswordErr" class="err" style="display:none"></div>
      </div>
      <div class="row">
        <label class="check"><input id="keepLogin" type="checkbox" /> 로그인 상태 유지</label>
      </div>
      <!-- flex/justify 클래스 제거 및 custom CSS 적용 -->
      <button id="btnLogin" type="submit" class="btn">
        <span>이메일로 로그인</span><div id="loginSpinner" class="spinner hidden"></div>
      </button>

      <div class="sep">또는</div>
      <button id="btnGoogleLogin" type="button" class="btn google">
        <img alt="Google 로고" src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18" />
        Google로 계속하기
      </button>
      <div class="hint">Google 또는 이메일로 로그인하실 수 있습니다.</div>
    </form>

    <!-- 회원가입 폼 -->
    <form id="formSignup" class="form" style="display:none" novalidate>
      <div class="field">
        <div class="label">이메일</div>
        <div class="input"><input id="signupEmail" type="email" placeholder="you@example.com" required /></div>
        <div id="signupEmailErr" class="err" style="display:none"></div>
      </div>
      <div class="field">
        <div class="label">비밀번호</div>
        <div class="input"><input id="signupPassword" type="password" placeholder="6자 이상, 영문/숫자 조합 권장" minlength="6" required /></div>
        <div id="signupPasswordErr" class="err" style="display:none"></div>
      </div>
      <div class="field">
        <div class="label">비밀번호 확인</div>
        <div class="input"><input id="signupPassword2" type="password" placeholder="다시 입력" minlength="6" required /></div>
        <div id="signupPassword2Err" class="err" style="display:none"></div>
      </div>
      <label class="check"><input id="agreeTos" type="checkbox" /> 이용약관 및 개인정보처리방침에 동의합니다.</label>
      <!-- flex/justify 클래스 제거 및 custom CSS 적용 -->
      <button id="btnSignup" type="submit" class="btn">
        <span>이메일로 회원가입</span><div id="signupSpinner" class="spinner hidden"></div>
      </button>

      <div class="sep">또는</div>
      <button id="btnGoogleSignup" type="button" class="btn google">
        <img alt="Google 로고" src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18" />
        Google로 가입하기
      </button>
      <div class="hint">가입 후 프로필은 언제든지 수정하실 수 있습니다.</div>
    </form>

  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
  // =========================================================================
  // 1. GLOBAL VARIABLES & UTILS
  // =========================================================================
  const $ = s => document.querySelector(s);
  const show = el => el.style.display = '';
  const hide = el => el.style.display = 'none';
  
  // 사용자 제공 Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyC2iRkFZUYZsVIbGzXcCLY1t4eBcfzvwzg",
    authDomain: "mateplay-a.firebaseapp.com",
    projectId: "mateplay-a",
    storageBucket: "mateplay-a.firebasestorage.app",
    messagingSenderId: "828604405793",
    appId: "1:828604405793:web:aaaa2020fcc44c7d1cab60",
    measurementId: "G-SHSQRWSLJL"
  };
  
  let auth;

  // 토스트 메시지 표시
  const toast = (msg) => {
    const t = $('#toast'); 
    t.textContent = msg; 
    t.classList.add('show');
    setTimeout(()=> t.classList.remove('show'), 3000);
  };

  // 폼 필드 에러 표시
  function setErr(id, msg){ 
    const el = $(id); 
    if(!el) return; 
    el.textContent = msg||''; 
    el.style.display = msg ? 'block':'none'; 
  }

  // 버튼 로딩 상태 토글 (스피너 높이 문제 해결을 위해 버튼 텍스트를 <span>으로 래핑함)
  function toggleLoading(buttonId, spinnerId, isLoading, originalText) {
      const btn = $(buttonId);
      const spinner = $(spinnerId);
      if (btn) {
          btn.disabled = isLoading;
          // .btn 내부의 <span>을 찾아 텍스트를 업데이트합니다.
          const textSpan = btn.querySelector('span');
          if (textSpan) {
              textSpan.textContent = isLoading ? '처리 중...' : originalText;
          } else {
             // Google 버튼은 텍스트를 변경하지 않습니다.
             if (buttonId !== '#btnGoogleLogin' && buttonId !== '#btnGoogleSignup') {
                btn.textContent = isLoading ? '처리 중...' : originalText; 
             }
          }
      }
      if (spinner) {
          // 로딩 중일 때만 스피너를 보여줍니다.
          spinner.classList.toggle('hidden', !isLoading);
      }
  }

  // 이메일 유효성 검사
  function emailValid(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

  // =========================================================================
  // 2. FIREBASE INITIALIZATION AND AUTH STATE
  // =========================================================================

  async function initializeFirebase() {
    if (!window.firebaseModules || Object.keys(firebaseConfig).length === 0) {
      toast('Firebase 설정이 없어 인증 기능을 사용할 수 없습니다.', 'err');
      return;
    }
    
    const { initializeApp, getAuth, onAuthStateChanged, signOut } = window.firebaseModules;
    try {
      const app = initializeApp(firebaseConfig);
      auth = getAuth(app);
    } catch (error) {
      console.error("Firebase Initialization Failed:", error);
      toast('Firebase 초기화에 실패했습니다.', 'err');
      return;
    }

    // 인증 상태 변화 리스너
    onAuthStateChanged(auth, (user) => {
      handleAuthStateChange(user);
    });

    // 로그아웃 버튼 이벤트 리스너 추가
    $('#btnLogout').addEventListener('click', async () => {
        try {
            await signOut(auth);
            toast('로그아웃되었습니다.');
        } catch (error) {
            console.error("Logout Error:", error);
            toast('로그아웃 중 오류가 발생했습니다.');
        }
    });
  }

  // 인증 상태에 따른 UI 업데이트
  function handleAuthStateChange(user) {
    const authStateEl = $('#authState');
    // authFooter가 삭제되었으므로 배열에서 제거
    const authForms = [$('#authTabs'), $('#formLogin'), $('#formSignup')]; 

    if (user) {
      // 로그인됨 (익명 사용자 제외)
      authForms.forEach(hide);
      show(authStateEl);
      $('#authEmail').textContent = user.email || (user.providerData?.[0]?.email || "소셜 계정");
      $('#authUID').textContent = `UID: ${user.uid}`;
      toast(`환영합니다, ${user.email || 'MatePlay 사용자'}님!`);
      $('.badge').textContent = '로그인됨';
    } else {
      // 로그아웃됨
      authForms.forEach(show);
      hide(authStateEl);
      // 로그인 폼으로 기본 설정
      const tabLogin = $('#tabLogin'), tabSignup = $('#tabSignup');
      const formLogin = $('#formLogin'), formSignup = $('#formSignup');
      
      tabLogin.classList.add('active'); 
      tabSignup.classList.remove('active');
      show(formLogin); 
      hide(formSignup);
      
      $('.badge').textContent = '인증';
    }
  }


  // =========================================================================
  // 3. HANDLERS (Email/Password)
  // =========================================================================

  // 이메일 로그인 제출
  $('#formLogin').addEventListener('submit', async (e) => {
    e.preventDefault();
    setErr('#loginEmailErr',''); setErr('#loginPasswordErr','');

    const email = $('#loginEmail').value.trim();
    const pw = $('#loginPassword').value;

    if(!emailValid(email)){ setErr('#loginEmailErr','올바른 이메일을 입력해 주세요.'); return; }
    if(!pw || pw.length < 6){ setErr('#loginPasswordErr','비밀번호는 6자 이상이어야 합니다.'); return; }

    toggleLoading('#btnLogin', '#loginSpinner', true, '이메일로 로그인');
    const { signInWithEmailAndPassword } = window.firebaseModules;
    
    try{
      await signInWithEmailAndPassword(auth, email, pw);
      // onAuthStateChanged에서 성공 메시지 및 UI 업데이트 처리
    }catch(error){
      let msg = '로그인에 실패했습니다. 이메일 또는 비밀번호를 확인해 주세요.';
      if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
          msg = '이메일 또는 비밀번호가 올바르지 않습니다.';
      } else if (error.code === 'auth/invalid-email') {
          msg = '유효하지 않은 이메일 형식입니다.';
      }
      setErr('#loginPasswordErr', msg);
      console.error("Login Error:", error);
    } finally {
      toggleLoading('#btnLogin', '#loginSpinner', false, '이메일로 로그인');
    }
  });

  // 이메일 회원가입 제출
  $('#formSignup').addEventListener('submit', async (e) => {
    e.preventDefault();
    setErr('#signupEmailErr',''); setErr('#signupPasswordErr',''); setErr('#signupPassword2Err','');

    const email = $('#signupEmail').value.trim();
    const pw = $('#signupPassword').value;
    const pw2 = $('#signupPassword2').value;
    const agree = $('#agreeTos').checked;

    if(!emailValid(email)){ setErr('#signupEmailErr','올바른 이메일을 입력해 주세요.'); return; }
    if(!pw || pw.length < 6){ setErr('#signupPasswordErr','비밀번호는 6자 이상이어야 합니다.'); return; }
    if(pw !== pw2){ setErr('#signupPassword2Err','비밀번호가 일치하지 않습니다.'); return; }
    if(!agree){ toast('약관에 동의해 주세요.'); return; }
    
    toggleLoading('#btnSignup', '#signupSpinner', true, '이메일로 회원가입');
    const { createUserWithEmailAndPassword } = window.firebaseModules;

    try{
      await createUserWithEmailAndPassword(auth, email, pw);
      // onAuthStateChanged에서 성공 메시지 및 UI 업데이트 처리
    }catch(error){
      let msg = '회원가입에 실패했습니다.';
      if (error.code === 'auth/email-already-in-use') {
          msg = '이미 사용 중인 이메일입니다.';
      } else if (error.code === 'auth/weak-password') {
          msg = '비밀번호가 너무 취약합니다 (6자 이상).';
      }
      setErr('#signupEmailErr', msg);
      console.error("Signup Error:", error);
    } finally {
      toggleLoading('#btnSignup', '#signupSpinner', false, '이메일로 회원가입');
    }
  });

  // =========================================================================
  // 4. HANDLERS (Google Login)
  // =========================================================================

  async function googleAuth(){
      const { GoogleAuthProvider, signInWithPopup } = window.firebaseModules;
      const provider = new GoogleAuthProvider();
      
      const btnLogin = $('#btnGoogleLogin');
      const btnSignup = $('#btnGoogleSignup');

      try {
          // Google 버튼 두 개 모두 비활성화
          btnLogin.disabled = true;
          btnSignup.disabled = true;

          await signInWithPopup(auth, provider);
          // onAuthStateChanged에서 성공 처리
          
      } catch (error) {
          let msg = 'Google 인증에 실패했습니다.';
          if (error.code === 'auth/popup-closed-by-user') {
              msg = 'Google 로그인 팝업이 닫혔습니다.';
          } else if (error.code === 'auth/cancelled-popup-request') {
              msg = '이미 진행 중인 인증 요청이 있습니다.';
          } else {
              console.error("Google Auth Error:", error);
              msg = `Google 인증 오류: ${error.code}`;
          }
          toast(msg);
      } finally {
          // Google 버튼 두 개 모두 활성화
          btnLogin.disabled = false;
          btnSignup.disabled = false;
      }
  }

  // =========================================================================
  // 5. EVENT BINDING & INIT
  // =========================================================================

  document.addEventListener('DOMContentLoaded', () => {
    initializeFirebase();

    // 탭 전환 이벤트
    const tabLogin = $('#tabLogin'), tabSignup = $('#tabSignup');
    const formLogin = $('#formLogin'), formSignup = $('#formSignup');

    tabLogin.addEventListener('click', () => {
      tabLogin.classList.add('active'); tabSignup.classList.remove('active');
      show(formLogin); hide(formSignup);
    });
    tabSignup.addEventListener('click', () => {
      tabSignup.classList.add('active'); tabLogin.classList.remove('active');
      show(formSignup); hide(formLogin);
    });

    // Google 로그인/가입 이벤트
    $('#btnGoogleLogin').addEventListener('click', googleAuth);
    $('#btnGoogleSignup').addEventListener('click', googleAuth);

  });
</script>
</body>
</html>
