<div id="searchViewContainer">
    <div style="padding: 0 10px 10px;">
        <!-- 검색 입력 필드 및 버튼 -->
        <div style="display: flex; gap: 8px;">
            <input type="text" id="searchInput" placeholder="아티스트, 노래 제목, 키워드를 입력하세요" 
                   style="flex-grow:1; padding:14px; border-radius:12px; border:1px solid #333; 
                          background:var(--panel-2); color:var(--text); font-size:16px; outline:none;" />
            <button id="searchBtn" style="appearance:none; border:none; outline:none; font-weight:700;
                                          padding:10px 18px; border-radius:12px; cursor:pointer; 
                                          background:var(--accent); color:#0a0d12; white-space:nowrap;
                                          box-shadow:0 4px 10px rgba(30,215,96,0.2);">
                <i class="fas fa-search"></i>
            </button>
        </div>
        
        <div id="searchMessage" style="margin-top:10px; font-size:12px; color:var(--muted); text-align:left;">
            <span id="spotifyStatusMessage"></span>
        </div>
    </div>

    <!-- 검색 결과가 표시될 영역. 메인 컨테이너의 .grid 스타일을 이용합니다. -->
    <div id="searchResults" class="grid" style="min-height: 100px;">
        <p style="text-align:center; padding-top:40px; color:var(--muted);">검색 버튼을 눌러 트랙을 찾아보세요.</p>
    </div>
</div>

<script>
    // 전역 유틸리티 함수 및 변수 접근
    const YT_API_KEY = window.YT_API_KEY;
    const setError = window.setError;
    const setHint = window.setHint;
    const isSpotifyAuthenticated = window.isSpotifyAuthenticated;
    const fetchSpotifyApi = window.fetchSpotifyApi;
    const playYouTubeTrack = window.playYouTubeTrack;
    const playSpotifyTrack = window.playSpotifyTrack; // Spotify 트랙 재생 (YouTube ID 검색 후 재생)

    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const searchResultsContainer = document.getElementById('searchResults');
    const spotifyStatusMessage = document.getElementById('spotifyStatusMessage');

    let isSearching = false;

    // Spotify 인증 상태에 따라 메시지 업데이트
    function updateStatusMessage() {
        if (isSpotifyAuthenticated()) {
            spotifyStatusMessage.innerHTML = '✅ **Spotify & YouTube 통합 검색**이 활성화되었습니다.';
            spotifyStatusMessage.style.color = 'var(--accent)';
        } else {
            spotifyStatusMessage.innerHTML = '⚠️ Spotify 연동 시 **통합 검색**을 이용할 수 있습니다.';
            spotifyStatusMessage.style.color = 'var(--muted)';
        }
    }

    // 통합 검색 함수
    async function performIntegratedSearch(query) {
        if (!query || isSearching) return;

        setError('');
        isSearching = true;

        const isAuthenticated = isSpotifyAuthenticated();
        const searchStatusText = isAuthenticated ? 'Spotify와 YouTube에서 통합 검색 중...' : 'YouTube에서 검색 중... (Spotify 미연동)';
        searchResultsContainer.innerHTML = `<div style="text-align:center; padding: 40px; color: var(--muted);"><i class="fas fa-spinner fa-spin fa-2x" style="color:var(--accent);"></i><p style="margin-top:10px;">${searchStatusText}</p></div>`;

        const searchPromises = [searchYouTube(query)];
        if (isAuthenticated) {
            searchPromises.push(searchSpotify(query));
        }

        try {
            const results = await Promise.all(searchPromises);
            const combinedResults = results.flat().filter(Boolean); // 결과를 하나의 배열로 합침
            renderSearchResults(combinedResults);
            setHint(`검색 결과: ${combinedResults.length}개 (YouTube ${results[0].length}개${isAuthenticated ? ' + Spotify ' + results[1].length + '개' : ''}) | 클릭하여 즉시 재생`);
        } catch (e) {
            setError('통합 검색 오류: ' + e.message);
            searchResultsContainer.innerHTML = `<p style="text-align:center; padding: 40px; color: var(--danger);">검색 중 오류 발생. API 키 또는 할당량을 확인해 주세요.</p>`;
        } finally {
            isSearching = false;
        }
    }

    // YouTube 검색 함수 (결과 포맷 통일)
    async function searchYouTube(query) {
        const url = new URL('https://www.googleapis.com/youtube/v3/search');
        url.searchParams.set('part', 'snippet');
        url.searchParams.set('q', query);
        url.searchParams.set('type', 'video');
        url.searchParams.set('videoCategoryId', '10');
        url.searchParams.set('maxResults', '10'); // 10개만 검색
        url.searchParams.set('key', YT_API_KEY);

        const response = await fetch(url);
        if (!response.ok) {
             throw new Error(`YouTube API 오류: ${response.status}`);
        }
        const data = await response.json();
        
        return (data.items || []).map(item => ({
            source: 'youtube',
            id: item.id.videoId,
            title: item.snippet.title,
            subtitle: item.snippet.channelTitle,
            image: item.snippet.thumbnails.medium.url,
            videoId: item.id.videoId // 재생에 필요
        }));
    }

    // Spotify 검색 함수 (결과 포맷 통일)
    async function searchSpotify(query) {
        try {
            const data = await fetchSpotifyApi('/search', { 
                q: query, 
                type: 'track', 
                limit: 10 // 10개만 검색
            });
            
            return (data.tracks?.items || []).map(track => ({
                source: 'spotify',
                id: track.id,
                title: track.name,
                subtitle: track.artists.map(a => a.name).join(', '),
                image: track.album.images[0]?.url || '',
                trackObject: track // 재생에 필요
            }));
        } catch (error) {
            // Spotify 인증 만료 등의 오류는 무시하고 YouTube 결과만 표시할 수 있도록 빈 배열 반환
            console.error("Spotify Search Failed:", error);
            return [];
        }
    }

    // 검색 결과를 화면에 렌더링하는 함수
    function renderSearchResults(items) {
        searchResultsContainer.innerHTML = '';
        if (items.length === 0) {
            searchResultsContainer.innerHTML = `<p style="text-align:center; padding: 40px; color: var(--muted);">검색 결과가 없습니다. 다른 키워드로 검색해 보세요.</p>`;
            return;
        }

        const frag = document.createDocumentFragment();
        items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card search-result';
            
            card.addEventListener('click', () => {
                if (item.source === 'youtube') {
                    playYouTubeTrack(item);
                } else if (item.source === 'spotify') {
                    playSpotifyTrack(item.trackObject);
                }
            });

            const thumb = document.createElement('div');
            thumb.className = 'thumb';
            if (item.image) {
                thumb.style.backgroundImage = `url(${item.image})`;
            } else {
                thumb.textContent = '🎵';
            }
            
            const meta = document.createElement('div');
            meta.className = 'meta';
            meta.innerHTML = `
                <div class="title">${item.title}</div>
                <div class="subtitle">${item.subtitle}</div>
            `;

            const chip = document.createElement('span');
            chip.className = 'chip';
            if (item.source === 'youtube') {
                chip.textContent = 'YouTube';
                chip.style.backgroundColor = '#ff000044'; // YouTube Red
            } else if (item.source === 'spotify') {
                chip.textContent = 'Spotify';
                chip.style.backgroundColor = 'var(--accent)';
                chip.style.color = '#0a0d12';
            }

            card.appendChild(thumb);
            card.appendChild(meta);
            card.appendChild(chip);
            frag.appendChild(card);
        });
        searchResultsContainer.appendChild(frag);
    }

    // 이벤트 리스너 설정
    function setupSearchListeners() {
        // 검색 버튼 클릭 이벤트
        searchBtn.addEventListener('click', () => {
            const query = searchInput.value.trim();
            if (query) performIntegratedSearch(query);
        });
        
        // 엔터 키 입력 이벤트
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const query = searchInput.value.trim();
                if (query) performIntegratedSearch(query);
            }
        });

        // 페이지 로드 시 포커스 및 상태 메시지 업데이트
        setTimeout(() => {
            searchInput.focus();
            updateStatusMessage();
        }, 100);
    }

    // 검색 페이지 로드 시 초기화
    setupSearchListeners();
</script>
