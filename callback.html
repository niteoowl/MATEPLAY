<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>MatePlay — 로그인 처리 중…</title>
  <style>
    :root{ --bg:#0f1115; --panel:#151823; --accent:#1ed760; --text:#eef2ff; --muted:#a7b0c6; --danger:#ff5d5d; }
    *{box-sizing:border-box} html,body{height:100%}
    body{ margin:0; background:linear-gradient(180deg,#0b0e14 0%, #0f1115 40%, #0f1115 100%);
      color:var(--text); font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Apple SD Gothic Neo,Noto Sans KR,sans-serif;
      display:grid; place-items:center; }
    .card{ width:min(480px,92vw); background:var(--panel); border:1px solid rgba(255,255,255,0.06);
      border-radius:16px; padding:20px; box-shadow:0 10px 30px rgba(0,0,0,.35); }
    .row{ display:flex; align-items:center; gap:12px }
    .logo{ font-size:22px; font-weight:800 }
    .badge{ font-size:11px; padding:2px 8px; border-radius:999px; background:#1b2030; color:var(--muted); border:1px solid rgba(255,255,255,.06) }
    .title{ margin:14px 0 6px; font-weight:800; font-size:18px }
    .desc{ color:var(--muted); font-size:13px; line-height:1.6 }
    .hint{ margin-top:12px; color:#a7b0c6; font-size:12px }
    .err{ margin-top:12px; color:var(--danger); font-size:13px }
    .btn{ margin-top:16px; width:100%; padding:12px 16px; border:none; border-radius:12px; background:var(--accent); color:#0a0d12; font-weight:800; cursor:pointer; }
    .spinner{ margin-top:14px; width:24px; height:24px; border:3px solid rgba(255,255,255,.12); border-top-color: var(--accent); border-radius:50%; animation:spin 1s linear infinite; }
    @keyframes spin{ to{ transform:rotate(360deg)}}
    .mono{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px; color:#cdd6f4 }
  </style>
</head>
<body>
  <div class="card">
    <div class="row">
      <div>🎧</div>
      <div class="logo">MatePlay</div>
      <div class="badge">Callback</div>
    </div>
    <div class="title">Spotify 인증 토큰 처리 중…</div>
    <div class="desc">잠시만 기다려 주세요. 로그인 정보가 안전하게 앱으로 전달됩니다.</div>
    <div id="stateBox" class="hint">Spotify 응답 확인 중...</div>
    <div id="errorBox" class="err" style="display:none"></div>
    <div class="spinner" aria-hidden="true"></div>
    <button id="backBtn" class="btn" style="display:none">앱으로 돌아가기</button>
    <div id="debug" class="mono" style="display:none; margin-top:10px"></div>
  </div>

<script>
  // 필수 설정 (메인 앱과 일치해야 함)
  const SPOTIFY_CLIENT_ID = '9841b0890ed6400cb6d8fdb0692c102f';
  const SPOTIFY_REDIRECT_URI = 'https://play.nmate.kr/callback';
  const APP_ENTRY_URL = 'https://play.nmate.kr/'; // 메인 앱 주소

  function parseAuthResponse(){
    const hash = window.location.hash.replace(/^#/, '');
    const hashParams = new URLSearchParams(hash);
    const qs = new URLSearchParams(window.location.search);
    
    // 에러는 hash 또는 query에 올 수 있습니다.
    const error = hashParams.get('error') || qs.get('error');
    if(error) return { error, raw: hash || window.location.search };

    // PKCE 성공 응답: code는 query string에 옵니다.
    const code = qs.get('code');
    if(code) return { code, raw: window.location.search };

    // 레거시 Implicit Flow 성공 응답 (PKCE 적용 후에는 사용되지 않음)
    const access_token = hashParams.get('access_token');
    if(access_token) return { access_token, token_type: hashParams.get('token_type'), expires_in: hashParams.get('expires_in'), raw: hash };
    
    return { raw: hash || window.location.search };
  }

  function redirectToApp(token){
    // 최종 토큰을 메인 앱의 hash로 전달하여 파싱하도록 합니다.
    const url = new URL(APP_ENTRY_URL);
    url.hash = `access_token=${encodeURIComponent(token.access_token)}&token_type=${encodeURIComponent(token.token_type||'Bearer')}&expires_in=${encodeURIComponent(token.expires_in||'3600')}`;
    window.location.replace(url.toString());
  }

  function postToOpener(token){
    try{
      if(window.opener && !window.opener.closed){
        window.opener.postMessage({ source:'spotify-auth', token }, '*');
        window.close();
        return true;
      }
    }catch(e){}
    return false;
  }

  function showError(msg, debug){
    const e = document.getElementById('errorBox');
    e.textContent = msg || '인증 처리 중 오류가 발생했습니다.';
    e.style.display = 'block';
    document.getElementById('stateBox').style.display = 'none';
    const spinner = document.querySelector('.spinner');
    if(spinner) spinner.style.display = 'none';
    const dbg = document.getElementById('debug');
    if(debug){ dbg.textContent = String(debug); dbg.style.display = 'block'; }
    const back = document.getElementById('backBtn');
    back.style.display = 'block';
    back.onclick = () => { window.location.href = APP_ENTRY_URL; };
  }

  async function handleCallback(){
    const { code, access_token, token_type, expires_in, error, raw } = parseAuthResponse();
    const stateBox = document.getElementById('stateBox');

    if(error){
      let msg = '인증이 취소되었거나 응답 타입이 올바르지 않습니다.';
      if(error === 'unsupported_response_type'){
        msg = '인증 응답 타입이 지원되지 않습니다. (Spotify 개발자 대시보드 설정 확인 필요)';
      }
      showError(msg, `error=${error}\nRaw: ${raw}`);
      return;
    }

    if(access_token){
        // Implicit Flow의 잔재가 남아있을 경우의 처리입니다.
        stateBox.textContent = 'Implicit Flow 토큰 확인: 앱으로 이동합니다…';
        redirectToApp({ access_token, token_type, expires_in });
        return;
    }

    if(!code){
      showError('인증 코드가 전달되지 않았습니다.', `URL: ${window.location.href}`);
      return;
    }

    // --- PKCE: Code Exchange (토큰 교환) ---
    const codeVerifier = sessionStorage.getItem('spotify_code_verifier');
    sessionStorage.removeItem('spotify_code_verifier'); // 사용 후 즉시 삭제

    if(!codeVerifier){
      showError('Code Verifier가 브라우저 저장소에 없습니다. 로그인 과정을 다시 시작해 주세요.', `Code: ${code}`);
      return;
    }

    stateBox.textContent = '토큰 교환 중 (PKCE)…';

    try {
        const body = new URLSearchParams({
            grant_type: 'authorization_code',
            code: code,
            redirect_uri: SPOTIFY_REDIRECT_URI,
            client_id: SPOTIFY_CLIENT_ID,
            code_verifier: codeVerifier,
        });

        const res = await fetch('https://accounts.spotify.com/api/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: body.toString(),
        });

        const data = await res.json();

        if(!res.ok || data.error){
            showError(`토큰 교환 실패: ${data.error || res.statusText}`, JSON.stringify(data, null, 2));
            return;
        }

        // 성공: Access Token 전달
        const tokenData = {
            access_token: data.access_token,
            token_type: data.token_type,
            expires_in: data.expires_in,
            refresh_token: data.refresh_token || undefined // refresh token은 사용하지 않지만 혹시 몰라 포함
        };
        
        stateBox.textContent = '토큰 교환 완료. 앱으로 이동합니다.';

        // postMessage 시도 (팝업/iframe 시), 실패 시 리다이렉션
        if(!postToOpener(tokenData)){
            redirectToApp(tokenData);
        }

    } catch (e) {
        showError('네트워크 오류로 토큰 교환에 실패했습니다.', e.message);
    }
  }

  handleCallback();
</script>
</body>
</html>
