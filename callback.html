<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Spotify 로그인 처리 중…</title>
  <style>
    :root{
      --bg:#0f1115; --panel:#151823; --accent:#1ed760; --text:#eef2ff; --muted:#a7b0c6; --danger:#ff5d5d;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; background:linear-gradient(180deg,#0b0e14 0%, #0f1115 40%, #0f1115 100%);
      color:var(--text); font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Apple SD Gothic Neo,Noto Sans KR,sans-serif;
      display:grid; place-items:center;
    }
    .card{
      width:min(440px,92vw);
      background:var(--panel);
      border:1px solid rgba(255,255,255,0.06);
      border-radius:16px; padding:20px;
      box-shadow:0 10px 30px rgba(0,0,0,.35);
    }
    .row{ display:flex; align-items:center; gap:12px }
    .logo{ font-size:22px; font-weight:800; letter-spacing:.2px }
    .badge{ font-size:11px; padding:2px 8px; border-radius:999px; background:#1b2030; color:var(--muted); border:1px solid rgba(255,255,255,.06) }
    .title{ margin:14px 0 6px; font-weight:800; font-size:18px }
    .desc{ color:var(--muted); font-size:13px; line-height:1.6 }
    .hint{ margin-top:12px; color:#a7b0c6; font-size:12px }
    .err{ margin-top:12px; color:var(--danger); font-size:13px }
    .btn{
      margin-top:16px; width:100%; padding:12px 16px; border:none; border-radius:12px;
      background:var(--accent); color:#0a0d12; font-weight:800; cursor:pointer;
    }
    .spinner{
      margin-top:14px; width:24px; height:24px; border:3px solid rgba(255,255,255,.12);
      border-top-color: var(--accent); border-radius:50%; animation:spin 1s linear infinite;
    }
    @keyframes spin{ to{ transform:rotate(360deg)}}
    .mono{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px; color:#cdd6f4 }
  </style>
</head>
<body>
  <div class="card">
    <div class="row">
      <div>🎧</div>
      <div class="logo">Music Hub</div>
      <div class="badge">Callback</div>
    </div>
    <div class="title">Spotify 인증 토큰 처리 중…</div>
    <div class="desc">
      잠시만 기다려 주세요. 로그인 정보가 안전하게 앱으로 전달됩니다.
    </div>
    <div id="stateBox" class="hint">redirect 중…</div>
    <div id="errorBox" class="err" style="display:none"></div>
    <div class="spinner" aria-hidden="true"></div>
    <button id="backBtn" class="btn" style="display:none">앱으로 돌아가기</button>
    <div id="debug" class="mono" style="display:none; margin-top:10px"></div>
  </div>

<script>
  // 설정: 앱의 메인 진입 URL을 명시하세요 (토큰을 전달할 곳)
  // 예: 메인 앱이 https://your-domain.com/ 라면 아래를 동일하게 설정
  const APP_ENTRY_URL = 'https://your-domain.com/';

  // URL 해시 파싱 (#access_token=...&token_type=Bearer&expires_in=3600 등)
  function parseHash(){
    const hash = window.location.hash.replace(/^#/, '');
    const params = new URLSearchParams(hash);
    const access_token = params.get('access_token');
    const token_type = params.get('token_type');
    const expires_in = params.get('expires_in');
    const state = params.get('state'); // 필요 시 검증
    const error = params.get('error'); // access_denied 등
    return { access_token, token_type, expires_in, state, error, raw: hash };
  }

  // 앱으로 안전하게 전달
  function redirectToApp(token){
    // 방법 1) 해시로 전달: 보안상 URL 기록에 남지 않도록 hash 사용
    const url = new URL(APP_ENTRY_URL);
    url.hash = `access_token=${encodeURIComponent(token.access_token)}&token_type=${encodeURIComponent(token.token_type||'Bearer')}&expires_in=${encodeURIComponent(token.expires_in||'3600')}`;
    window.location.replace(url.toString());
  }

  // opener(팝업) 사용 시 postMessage로도 전달 가능
  function postToOpener(token){
    try{
      if(window.opener && !window.opener.closed){
        window.opener.postMessage({ source:'spotify-auth', token }, '*');
        window.close();
        return true;
      }
    }catch(e){}
    return false;
  }

  function showError(msg, debug){
    const e = document.getElementById('errorBox');
    e.textContent = msg || '인증 처리 중 오류가 발생했습니다.';
    e.style.display = 'block';
    document.getElementById('stateBox').style.display = 'none';
    const dbg = document.getElementById('debug');
    if(debug){ dbg.textContent = String(debug); dbg.style.display = 'block'; }
    const back = document.getElementById('backBtn');
    back.style.display = 'block';
    back.onclick = () => { window.location.href = APP_ENTRY_URL; };
  }

  (function main(){
    const { access_token, token_type, expires_in, error, raw } = parseHash();

    if(error){
      showError('사용자 동의가 거부되었거나 인증이 취소되었습니다.', `error=${error}`);
      return;
    }

    if(!access_token){
      // Spotify가 쿼리스트링으로 보내는 경우는 거의 없지만, 방어적으로 확인
      const qs = new URLSearchParams(window.location.search);
      if(qs.get('error')){
        showError('인증 중 오류가 보고되었습니다.', window.location.search);
        return;
      }
      showError('토큰이 전달되지 않았습니다.', window.location.href);
      return;
    }

    // 우선 팝업 시나리오 postMessage 시도 → 실패 시 메인으로 해시 리다이렉트
    const sent = postToOpener({ access_token, token_type, expires_in });
    if(sent){
      document.getElementById('stateBox').textContent = '팝업 창을 닫고 앱으로 돌아갑니다…';
      return;
    }

    document.getElementById('stateBox').textContent = '앱으로 이동합니다…';
    redirectToApp({ access_token, token_type, expires_in });
  })();
</script>
</body>
</html>
