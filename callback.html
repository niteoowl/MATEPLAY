<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Spotify 인증 토큰 처리 중</title>
  <style>
    body{
        font-family: sans-serif;
        background-color: #0b0e14; 
        color: #eef2ff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        text-align: center;
    }
    .loader {
        border: 4px solid #1ed76022;
        border-top: 4px solid #1ed760;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
    }
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    .message {
        font-size: 16px;
        color: #96a0b5;
    }
    .error {
        color: #ff5d5d;
        font-weight: bold;
    }
    .detail {
        margin-top: 10px;
        font-size: 12px;
        color: #5d667c;
    }
  </style>
</head>
<body>

  <div class="loader" id="loader"></div>
  <div class="message" id="message">
    Spotify 인증 토큰 처리 중…
    <p class="detail">잠시만 기다려 주세요. 로그인 정보가 안전하게 앱으로 전달됩니다.</p>
  </div>
  <div class="error" id="errorBox"></div>

<script>
  // -------------------------
  // 🔑 Spotify PKCE 인증 설정 🔑
  // -------------------------
  const SPOTIFY_CLIENT_ID = '9841b0890ed6400cb6d8fdb0692c102f'; 
  // 콜백 페이지 자체의 URL (이 페이지로 리디렉션됨)
  const SPOTIFY_REDIRECT_URI = 'https://play.nmate.kr/callback'; 
  // 토큰을 최종적으로 전달할 메인 앱 URL
  const MAIN_APP_URL = 'https://play.nmate.kr/'; 

  function showError(msg, detail = '') {
    document.getElementById('loader').style.display = 'none';
    document.getElementById('message').innerHTML = '<span class="error">오류가 발생했습니다.</span>';
    document.getElementById('errorBox').textContent = msg + (detail ? ` (${detail})` : '');
    console.error("Authentication Error:", msg, detail);
  }

  // -------------------------
  // 🔄 Spotify PKCE Callback (Code to Token 교환) 🔄
  // -------------------------
  async function handleTokenExchange(){
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const error = params.get('error');

    // 1. 에러 처리
    if (error) {
      showError(`Spotify 로그인 오류: ${error}`);
      return;
    }
    
    // 2. Code, Verifier 확인
    if (!code) {
      showError('인증 코드가 URL에 없습니다.', 'Spotify 로그인 과정을 다시 시작해 주세요.');
      return;
    }

    // ⭐ 세션 스토리지에서 Verifier 로드 (이전 단계에서 저장함)
    const codeVerifier = sessionStorage.getItem('spotify_code_verifier');
    sessionStorage.removeItem('spotify_code_verifier'); // 사용 후 즉시 삭제

    if(!codeVerifier){
      showError('Code Verifier가 브라우저 저장소에 없습니다.', '로그인 과정을 다시 시작해 주세요.');
      return;
    }

    // 3. 토큰 교환 요청 (POST)
    try {
      const res = await fetch('https://accounts.spotify.com/api/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          client_id: SPOTIFY_CLIENT_ID,
          grant_type: 'authorization_code',
          code: code,
          redirect_uri: SPOTIFY_REDIRECT_URI,
          code_verifier: codeVerifier, 
        })
      });

      if(!res.ok) {
        const errText = await res.text().catch(()=> '응답 본문 없음');
        throw new Error(`[${res.status}] ${errText.substring(0, 100)}...`);
      }

      const data = await res.json();
      const token = data.access_token;
      const expiry = data.expires_in;
      
      // 4. ⭐ 최종 리디렉션: 토큰을 메인 앱으로 전달
      // Fragment(#)를 사용하여 메인 페이지로 토큰 정보를 전달합니다.
      const finalRedirectUrl = `${MAIN_APP_URL}#access_token=${token}&expires_in=${expiry}`;
      
      document.getElementById('message').innerHTML = '<span style="color:#1ed760; font-weight:bold;">✅ 인증 성공! 메인 앱으로 돌아갑니다.</span>';
      
      // 사용자를 메인 페이지로 강제 리디렉션
      window.location.replace(finalRedirectUrl);

    } catch(e) {
      showError('Spotify 토큰 교환 실패', e.message);
    }
  }

  // 페이지 로드 시 실행
  window.onload = handleTokenExchange;
</script>
</body>
</html>
