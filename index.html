<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Music Hub — Spotify + YouTube</title>
  <style>
    :root{
      --bg:#0f1115;
      --panel:#151823;
      --panel-2:#1b2030;
      --accent:#1ed760; /* Spotify 그린 */
      --muted:#96a0b5;
      --text:#eef2ff;
      --danger:#ff5d5d;
      --shadow:0 10px 30px rgba(0,0,0,0.35);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;background:linear-gradient(180deg,#0b0e14 0%, #0f1115 40%, #0f1115 100%);
      color:var(--text); font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Apple SD Gothic Neo, Noto Sans KR, sans-serif;
      overflow:hidden;
    }
    /* 상단 앱바 */
    .appbar{
      position:sticky; top:0; z-index:10;
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 16px; background:rgba(15,17,21,0.8); backdrop-filter: blur(10px); border-bottom:1px solid rgba(255,255,255,0.06);
    }
    .brand{display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:0.2px}
    .badge{
      font-size:11px; padding:2px 8px; border-radius:999px; background:var(--panel-2); color:var(--muted);
      border:1px solid rgba(255,255,255,0.06);
    }
    
    /* === 개선된 인증 영역 CSS === */
    .auth-area {
      display: flex;
      align-items: center;
      gap: 12px; /* Spotify와 Firebase 영역 사이 간격 */
    }

    .login-btn, .logout-btn{
      appearance:none; border:none; outline:none;
      font-weight:700;
      padding:10px 14px; border-radius:12px;
      white-space:nowrap; cursor:pointer; transition:transform 0.1s;
    }
    /* Spotify/Firebase 일반 로그인 버튼 */
    .login-btn{
      background:var(--accent); color:#0a0d12;
      box-shadow:0 6px 20px rgba(30,215,96,0.3);
    }
    .login-btn:hover { transform: translateY(-1px); }

    /* Spotify 일반 로그아웃 버튼 */
    .logout-btn{ 
      background:var(--panel-2); color:var(--text); 
      box-shadow:var(--shadow); 
      border:1px solid rgba(255,255,255,0.06);
    }
    .logout-btn:hover { transform: translateY(-1px); }

    /* Firebase 사용자 정보 (예쁜 칩 스타일) */
    #userInfo {
        background: var(--panel-2);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 999px; /* 완전 둥글게 */
        padding: 4px 6px 4px 14px; /* 왼쪽 텍스트 공간 확보 */
        box-shadow:var(--shadow);
        display: flex;
        align-items: center;
        gap: 8px; /* 내부 요소 간격 */
    }
    #userEmail {
        font-size: 13px;
        font-weight: 500;
        color: var(--text);
        max-width: 120px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    /* Firebase 칩 내부의 로그아웃 버튼 */
    #firebaseLogoutBtn {
        /* 기존 스타일 상속 방지 */
        appearance:none; border:none; outline:none;
        cursor: pointer; transition: transform 0.1s;

        /* 디자인 변경 */
        padding: 4px 8px;
        font-size: 12px;
        font-weight: 700;
        border-radius: 999px;
        background: var(--danger); /* 빨간색으로 시각적 강조 */
        color: white;
        box-shadow: none; 
    }
    /* === 개선된 인증 영역 CSS 끝 === */


    /* 레이아웃 */
    .container{
      display:grid; grid-template-rows:auto 1fr auto; height:100%;
    }
    .content{
      display:grid; grid-template-rows:auto 1fr; gap:12px; padding:12px; height:calc(100vh - 160px);
    }

    /* 검색/탭 */
    .controls{
      display:flex; gap:10px; align-items:center; overflow:auto; padding:4px 2px;
    }
    .pill{
      white-space:nowrap; padding:8px 12px; border-radius:999px; background:var(--panel);
      border:1px solid rgba(255,255,255,0.06); color:var(--muted); font-size:13px;
    }
    .pill.active{ background:#1ed76022; color:var(--text); border-color:#1ed76055 }

    .search{
      flex:1; display:flex; gap:8px; align-items:center; background:var(--panel);
      border:1px solid rgba(255,255,255,0.06); border-radius:12px; padding:8px 10px;
    }
    .search input{
      flex:1; border:none; outline:none; background:transparent; color:var(--text);
      font-size:14px;
    }

    /* 리스트 영역 */
    .grid{
      overflow:auto; padding-bottom:12px;
    }
    .section-title{
      font-weight:700; margin:6px 6px 10px; color:#dbe3ff; font-size:14px;
    }
    .card{
      display:flex; gap:12px; align-items:center; background:var(--panel);
      border:1px solid rgba(255,255,255,0.06); border-radius:14px; padding:12px; margin:6px;
      cursor:pointer; transition:transform .15s ease, background .15s ease, border-color .15s ease;
    }
    .card:hover{ transform:translateY(-1px); border-color:#1ed76055; background:#161a26 }
    .thumb{
      width:52px; height:52px; border-radius:8px; background:#222837; flex:0 0 52px; overflow:hidden; display:grid; place-items:center; color:#7f8bad;
      border:1px solid rgba(255,255,255,0.06);
    }
    .meta{ flex:1; min-width:0 }
    .title{
      font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .subtitle{
      color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      margin-top:2px;
    }
    .chip{
      font-size:11px; color:#a7b0c6; background:#22283a; padding:2px 8px; border-radius:999px; border:1px solid rgba(255,255,255,0.06);
    }

    /* 플레이어 바 */
    .player{
      position:fixed; left:0; right:0; bottom:0; background:rgba(15,17,21,0.9); backdrop-filter: blur(10px);
      border-top:1px solid rgba(255,255,255,0.06);
      padding:10px 12px; display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center;
    }
    .now{
      display:flex; align-items:center; gap:10px; min-width:0;
    }
    .now .thumb{ width:48px; height:48px }
    .now .title{ font-size:13px }
    .now .subtitle{ font-size:11px }

    .controls-row{
      display:flex; align-items:center; gap:10px;
    }
    .btn{
      appearance:none; border:none; outline:none; background:#232a3d; color:var(--text);
      border:1px solid rgba(255,255,255,0.06); width:38px; height:38px; border-radius:10px;
      display:grid; place-items:center; cursor:pointer;
    }
    .btn.primary{ background:var(--accent); color:#0a0d12; font-weight:800 }
    .time{
      display:flex; align-items:center; gap:8px; color:#aeb6cc; font-size:11px; margin-top:6px;
    }
    .seek{
      appearance:none; width:100%; height:6px; border-radius:999px; background:#232a3d; outline:none;
    }
    .seek::-webkit-slider-thumb{
      -webkit-appearance:none; appearance:none; width:14px; height:14px; border-radius:50%; background:var(--accent); border:2px solid #0a0d12;
      margin-top:-4px;
    }

    /* 유틸 */
    .hidden{ display:none !important }
    .err{ color:var(--danger); font-size:12px; margin:8px 6px 0 }
    .hint{ color:#a7b0c6; font-size:12px; margin:6px }
    /* 스크롤 스타일 */
    .grid::-webkit-scrollbar, .content::-webkit-scrollbar { width:8px; height:8px }
    .grid::-webkit-scrollbar-thumb, .content::-webkit-scrollbar-thumb { background:#2a3246; border-radius:999px }
  </style>
</head>
<body>
<div class="container">

  <div class="appbar">
    <div class="brand">
      <span>🎧</span>
      <span>Music Hub</span>
      <span class="badge">Spotify · YouTube</span>
    </div>
    <!-- 인증 영역 (Spotify + Firebase) -->
    <div class="auth-area">
      <!-- Spotify Auth -->
      <div>
        <button id="loginBtn" class="login-btn">Spotify 로그인</button>
        <button id="logoutBtn" class="logout-btn hidden">Spotify 로그아웃</button>
      </div>
      <!-- Firebase Auth -->
      <div id="firebaseAuthControl" style="display:flex; align-items:center;">
        <button id="firebaseLoginBtn" class="login-btn">로그인</button>
        <div id="userInfo" class="hidden">
          <span id="userEmail"></span>
          <button id="firebaseLogoutBtn">로그아웃</button>
        </div>
      </div>
    </div>
  </div>

  <div class="content">
    <div class="controls">
<!-- ... (Controls content) ... -->
    </div>

    <div id="errorBox" class="err hidden"></div>
    <div id="hintBox" class="hint">Spotify에서 가져온 항목을 누르면 YouTube에서 자동 검색해 재생합니다.</div>

    <div id="list" class="grid" role="list"></div>
  </div>

  <div class="player">
<!-- ... (Player content) ... -->
  </div>
</div>

<!-- YouTube IFrame API & Application Logic -->
<script type="module">
  // Firebase SDKs Import
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
  import { getAuth, onAuthStateChanged, signInWithCustomToken, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

  // 환경 설정: 반드시 값 교체
  const SPOTIFY_CLIENT_ID = 'YOUR_SPOTIFY_CLIENT_ID'; // 교체
  const SPOTIFY_REDIRECT_URI = 'https://your-domain.com/callback'; // 교체 (콜백 URI)
  const SPOTIFY_SCOPES = [
    'user-read-email',
    'playlist-read-private',
    'user-library-read' // 좋아요한 트랙
  ].join(' ');
  const YT_API_KEY = 'AIzaSyAIhw6pfhduLDZRdv5FqzddSBqHjMQQzEE'; // 제공된 키 사용

  // 토큰/상태
  let accessToken = null;
  let expiresAt = 0;

  // 재생 큐
  let queue = [];
  let queueIndex = -1;

  // YouTube 플레이어
  let ytPlayer = null;
  let ytReady = false;
  let progressTimer = null;

  // -------------------------
  // 🎵 Firebase Auth Integration 🎵
  // -------------------------

  // Firebase 설정 (사용자가 제공한 정보)
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyC2iRkFZUYZsVIbGzXcCLY1t4eBcfzvwzg",
    authDomain: "mateplay-a.firebaseapp.com",
    projectId: "mateplay-a",
    storageBucket: "mateplay-a.firebasestorage.app",
    messagingSenderId: "828604405793",
    appId: "1:828604405793:web:aaaa2020fcc44c7d1cab60",
    measurementId: "G-SHSQRWSLJL"
  };

  let firebaseApp;
  let auth;
  let currentFirebaseUser = null;
  const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

  try {
    firebaseApp = initializeApp(FIREBASE_CONFIG);
    auth = getAuth(firebaseApp);

    // 1. Custom Token Sign In (익명 로그인 제외)
    if (initialAuthToken) {
      signInWithCustomToken(auth, initialAuthToken)
        .catch(error => {
          console.error("Custom token sign-in failed:", error);
          setError("자동 로그인에 실패했습니다. (Custom Token 오류)");
        });
    }

    // 2. Auth State Listener: 인증 상태가 변경될 때마다 UI 업데이트
    onAuthStateChanged(auth, (user) => {
      currentFirebaseUser = user;
      updateFirebaseAuthUI(user);
    });
  } catch(e) {
    console.error("Firebase initialization failed:", e);
    setError('Firebase 초기화 실패: ' + e.message);
  }

  // Firebase 인증 UI 업데이트
  function updateFirebaseAuthUI(user) {
    const userInfoEl = document.getElementById('userInfo');
    const loginBtnEl = document.getElementById('firebaseLoginBtn');
    const userEmailEl = document.getElementById('userEmail');

    if (user) {
      userInfoEl.classList.remove('hidden');
      loginBtnEl.classList.add('hidden');
      // 사용자 이메일 또는 UID 표시
      userEmailEl.textContent = user.email || user.uid.substring(0, 8) + '...';
    } else {
      userInfoEl.classList.add('hidden');
      loginBtnEl.classList.remove('hidden');
      userEmailEl.textContent = '';
    }
  }

  // Firebase 로그아웃 처리
  async function firebaseLogout() {
    try {
      await signOut(auth);
      setError('Firebase에서 로그아웃되었습니다.');
    } catch(e) {
      setError('로그아웃 오류: ' + e.message);
    }
  }

  // 커스텀 모달 (alert() 사용 금지 규정 준수)
  function showLoginModal() {
    const existingModal = document.getElementById('loginModalOverlay');
    if (existingModal) return;

    const modal = document.createElement('div');
    modal.id = 'loginModalOverlay';
    modal.innerHTML = `
      <style>
        .modal-content {
            background:var(--panel-2); color:var(--text); padding:24px; border-radius:14px; width:90%; max-width:400px; box-shadow:var(--shadow);
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
      </style>
      <div style="position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.8); z-index:100; display:flex; justify-content:center; align-items:center;">
        <div class="modal-content">
          <h3 style="font-size:22px; font-weight:700; margin-bottom:15px; color:#1ed760;">계정 로그인</h3>
          <p style="color:var(--muted); margin-bottom:20px; font-size:14px;">
            사용자님의 요청에 따라 <code style="color:#1ed760;">/auth</code> 페이지 이동을 시뮬레이션했습니다.
            <br><br>
            여기에 실제 이메일/비밀번호 필드 및 Firebase Auth SDK(예: <code style="background:#22283a; padding:2px 4px; border-radius:4px;">signInWithEmailAndPassword</code>)를 사용하는 로그인/회원가입 UI를 구현해야 합니다.
          </p>
          <button id="closeModal" class="login-btn" style="background:#4f46e5; width:100%">확인하고 닫기</button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);

    const closeModal = () => {
        const overlay = document.getElementById('loginModalOverlay');
        if (overlay) document.body.removeChild(overlay);
        // 모달 닫을 때 URL 해시 제거
        window.history.replaceState({}, document.title, window.location.pathname + window.location.search);
        setError('');
    };

    modal.querySelector('#closeModal').addEventListener('click', closeModal);
    // ESC 키로 닫기
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

    setError('Firebase 로그인 페이지 (#auth)가 열렸습니다.');
  }

  function checkHashAndShowModal() {
    if (window.location.hash === '#auth') {
      showLoginModal();
    }
  }


  // -------------------------
  // 🎵 기존 애플리케이션 로직 🎵
  // -------------------------

  // 유틸
  const $ = sel => document.querySelector(sel);
  const $$ = sel => document.querySelectorAll(sel);
// ... (나머지 유틸 함수, Spotify 로직, YouTube 로직은 이전과 동일) ...

  const ms = s => Math.floor(s).toString().padStart(2,'0');
  function formatTime(sec){
    if(!isFinite(sec) || sec < 0) return '0:00';
    const m = Math.floor(sec/60), s = Math.floor(sec%60);
    return `${m}:${s.toString().padStart(2,'0')}`;
  }
  function setError(msg){
    const box = $('#errorBox');
    box.textContent = msg || '';
    box.classList.toggle('hidden', !msg);
  }
  function setHint(msg){
    const box = $('#hintBox');
    box.textContent = msg || '';
    box.classList.toggle('hidden', !msg);
  }

  // OAuth Implicit Flow 파서
  function parseHashParams(){
    const h = window.location.hash.replace(/^#/, '');
    const params = new URLSearchParams(h);
    const token = params.get('access_token');
    const type = params.get('token_type');
    const expiresIn = params.get('expires_in');
    if(token && type === 'Bearer'){
      accessToken = token;
      expiresAt = Date.now() + (Number(expiresIn||3600)*1000);
      window.history.replaceState({}, document.title, window.location.pathname + window.location.search);
      $('#loginBtn').classList.add('hidden');
      $('#logoutBtn').classList.remove('hidden');
      loadPlaylists();
    }
  }

  function login(){
    const authUrl = new URL('https://accounts.spotify.com/authorize');
    authUrl.searchParams.set('client_id', SPOTIFY_CLIENT_ID);
    authUrl.searchParams.set('response_type', 'token');
    authUrl.searchParams.set('redirect_uri', SPOTIFY_REDIRECT_URI);
    authUrl.searchParams.set('scope', SPOTIFY_SCOPES);
    authUrl.searchParams.set('show_dialog', 'true');
    window.location.href = authUrl.toString();
  }

  function logout(){
    accessToken = null; expiresAt = 0;
    $('#loginBtn').classList.remove('hidden');
    $('#logoutBtn').classList.add('hidden');
    $('#list').innerHTML = '';
    setHint('로그아웃되었습니다. 다시 로그인해 주세요.');
  }

  async function spotify(endpoint, params){
    if(!accessToken || Date.now() > expiresAt){ throw new Error('인증이 만료되었습니다. 다시 로그인해 주세요.'); }
    const url = new URL('https://api.spotify.com/v1' + endpoint);
    if(params){ Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v)); }
    const res = await fetch(url, { headers: { Authorization: 'Bearer ' + accessToken } });
    if(!res.ok){
      const t = await res.text().catch(()=> '');
      throw new Error('Spotify 오류: ' + res.status + ' ' + t);
    }
    return res.json();
  }

  // UI 렌더
  function renderList(items, type){
    const root = $('#list');
    root.innerHTML = '';
    if(!items || !items.length){
      root.innerHTML = `<div class="hint" style="margin:12px">항목이 비어 있습니다.</div>`;
      return;
    }
    const frag = document.createDocumentFragment();
    items.forEach((it, idx) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.setAttribute('role', 'listitem');
      card.addEventListener('click', () => onItemClick(it, type));

      const thumb = document.createElement('div');
      thumb.className = 'thumb';
      if(type === 'playlist' && it.images?.[0]?.url){
        thumb.style.backgroundImage = `url(${it.images[0].url})`;
        thumb.style.backgroundSize = 'cover';
      }else if(type === 'track' && it.album?.images?.[0]?.url){
        thumb.style.backgroundImage = `url(${it.album.images[0].url})`;
        thumb.style.backgroundSize = 'cover';
      }else{
        thumb.textContent = '🎵';
      }

      const meta = document.createElement('div');
      meta.className = 'meta';
      const t = document.createElement('div');
      t.className = 'title';
      t.textContent = type === 'playlist' ? it.name : it.name || it.track?.name || '제목 없음';

      const s = document.createElement('div');
      s.className = 'subtitle';
      if(type === 'playlist'){
        s.textContent = `${(it.tracks?.total||0)}곡 · ${it.owner?.display_name||'—'}`;
      }else{
        const artists = (it.artists || it.track?.artists || []).map(a=>a.name).join(', ');
        const album = it.album?.name || it.track?.album?.name || '';
        s.textContent = `${artists}${album ? ' · ' + album : ''}`;
      }

      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = type === 'playlist' ? 'Playlist' : 'Track';

      meta.appendChild(t); meta.appendChild(s);
      card.appendChild(thumb);
      card.appendChild(meta);
      card.appendChild(chip);
      frag.appendChild(card);
    });
    root.appendChild(frag);
  }

  // 탭 로직
  $('#tabPlaylists').addEventListener('click', () => { setTabs('playlists'); loadPlaylists(); });
  $('#tabLiked').addEventListener('click', () => { setTabs('liked'); loadLiked(); });
  $('#tabRec').addEventListener('click', () => { setTabs('rec'); loadRecommendations(); });
  function setTabs(key){
    $$('.pill').forEach(p => p.classList.remove('active'));
    if(key === 'playlists') $('#tabPlaylists').classList.add('active');
    if(key === 'liked') $('#tabLiked').classList.add('active');
    if(key === 'rec') $('#tabRec').classList.add('active');
    setError('');
  }

  // 데이터 로드
  async function loadPlaylists(){
    try{
      setHint('플레이리스트를 불러오는 중…');
      const me = await spotify('/me');
      const data = await spotify('/me/playlists', { limit: 50 });
      renderList(data.items || [], 'playlist');
      setHint(`${me.display_name}님의 플레이리스트`);
    }catch(e){ setError(e.message); setHint(''); }
  }
  async function loadLiked(){
    try{
      setHint('좋아요한 트랙을 불러오는 중…');
      const data = await spotify('/me/tracks', { limit: 50 });
      const tracks = (data.items || []).map(it => it.track).filter(Boolean);
      renderList(tracks, 'track');
      setHint('좋아요한 트랙');
    }catch(e){ setError(e.message); setHint(''); }
  }
  async function loadRecommendations(){
    try{
      setHint('추천 트랙을 불러오는 중…');
      // 기본 seed: 최근 좋아요 상위 5곡 기반
      const saved = await spotify('/me/tracks', { limit: 5 });
      const seedArtists = new Set(), seedTracks = [];
      (saved.items || []).forEach(it => {
        const t = it.track; if(!t) return;
        if(t.artists?.[0]?.id) seedArtists.add(t.artists[0].id);
        if(t.id) seedTracks.push(t.id);
      });
      const params = {};
      if(seedArtists.size) params.seed_artists = Array.from(seedArtists).slice(0,2).join(',');
      if(seedTracks.length) params.seed_tracks = seedTracks.slice(0,3).join(',');
      if(!params.seed_artists && !params.seed_tracks){
        params.seed_genres = 'pop';
      }
      const rec = await spotify('/recommendations', Object.assign({ limit: 30 }, params));
      renderList(rec.tracks || [], 'track');
      setHint('맞춤형 추천');
    }catch(e){ setError(e.message); setHint(''); }
  }

  // 항목 클릭 → 큐 구성 → YouTube 재생
  async function onItemClick(item, type){
    try{
      if(type === 'playlist'){
        const plId = item.id;
        const data = await spotify(`/playlists/${plId}/tracks`, { limit: 50 });
        queue = (data.items||[])
          .map(i => i.track)
          .filter(Boolean)
          .map(t => toQueueItem(t));
        queueIndex = 0;
        playQueueIndex(queueIndex, true);
      }else{
        queue = [toQueueItem(item)];
        queueIndex = 0;
        playQueueIndex(0, true);
      }
    }catch(e){ setError(e.message); }
  }

  function toQueueItem(t){
    const title = t.name || '제목 없음';
    const artists = (t.artists||[]).map(a=>a.name).join(', ');
    const query = `${title} ${artists} audio`;
    const image = t.album?.images?.[0]?.url || '';
    return { title, artists, query, image };
  }

  // YouTube 검색 → 첫 결과 재생
  async function playQueueIndex(idx, autoplay){
    if(idx < 0 || idx >= queue.length) return;
    const it = queue[idx];
    setNowPlaying(it);
    try{
      const vid = await ytSearchFirstVideo(it.query);
      if(!vid){ setError('YouTube 검색 결과가 없습니다.'); return; }
      ensureYTPlayer();
      if(ytReady){
        ytPlayer.loadVideoById(vid);
        if(!autoplay){ ytPlayer.pauseVideo(); }
      }else{
        // 준비되면 자동 load
        const timer = setInterval(() => {
          if(ytReady){
            clearInterval(timer);
            ytPlayer.loadVideoById(vid);
            if(!autoplay){ ytPlayer.pauseVideo(); }
          }
        }, 150);
      }
    }catch(e){ setError('YouTube 재생 오류: ' + e.message); }
  }

  function setNowPlaying(it){
    $('#nowTitle').textContent = it.title;
    $('#nowSubtitle').textContent = it.artists || '—';
    const n = $('#nowThumb');
    if(it.image){
      n.style.backgroundImage = `url(${it.image})`;
      n.style.backgroundSize = 'cover';
      n.textContent = '';
    }else{
      n.style.backgroundImage = '';
      n.textContent = '🎵';
    }
  }

  async function ytSearchFirstVideo(q){
    const url = new URL('https://www.googleapis.com/youtube/v3/search');
    url.searchParams.set('part','snippet');
    url.searchParams.set('q', q);
    url.searchParams.set('type','video');
    url.searchParams.set('videoCategoryId','10'); // Music
    url.searchParams.set('maxResults','1');
    url.searchParams.set('key', YT_API_KEY);
    const res = await fetch(url);
    if(!res.ok){ throw new Error(res.status + ' 검색 실패'); }
    const j = await res.json();
    return j.items?.[0]?.id?.videoId || null;
  }

  // YouTube IFrame 준비
  function ensureYTPlayer(){
    if(ytPlayer) return;
    if(!window.YT){
      const tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      document.body.appendChild(tag);
      window.onYouTubeIframeAPIReady = createPlayer;
    }else{
      createPlayer();
    }
  }
  function createPlayer(){
    const div = document.createElement('div');
    div.id = 'yt-iframe';
    div.style.position='fixed'; div.style.left='-9999px'; div.style.top='-9999px';
    document.body.appendChild(div);
    ytPlayer = new YT.Player('yt-iframe', {
      height: '0', width: '0', videoId: '',
      playerVars: { 'playsinline': 1 },
      events:{
        'onReady': () => {
          ytReady = true;
          setupProgressTimer();
        },
        'onStateChange': onYTStateChange,
        'onError': () => setError('YouTube 플레이어 오류가 발생했습니다.')
      }
    });
  }
  function onYTStateChange(e){
    const state = e.data;
    // -1: unstarted, 0: ended, 1: playing, 2: paused, 3: buffering, 5: cued
    if(state === 1){
      $('#playPauseBtn').textContent = '⏸';
      setError('');
    }else if(state === 2 || state === 5){
      $('#playPauseBtn').textContent = '▶';
    }else if(state === 0){
      // 다음 곡 자동재생
      if(queueIndex < queue.length - 1){
        queueIndex++;
        playQueueIndex(queueIndex, true);
      }
    }
  }

  // 플레이어 컨트롤
  $('#playPauseBtn').addEventListener('click', () => {
    if(!ytPlayer) return ensureYTPlayer();
    const st = ytPlayer.getPlayerState();
    if(st === 1){ ytPlayer.pauseVideo(); }
    else { ytPlayer.playVideo(); }
  });
  $('#prevBtn').addEventListener('click', () => {
    if(queueIndex > 0){ queueIndex--; playQueueIndex(queueIndex, true); }
  });
  $('#nextBtn').addEventListener('click', () => {
    if(queueIndex < queue.length - 1){ queueIndex++; playQueueIndex(queueIndex, true); }
  });
  $('#muteBtn').addEventListener('click', () => {
    if(!ytPlayer) return;
    if(ytPlayer.isMuted()) ytPlayer.unMute(); else ytPlayer.mute();
  });

  // 검색창 → YouTube 재생
  $('#searchInput').addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){
      const q = e.currentTarget.value.trim();
      if(!q) return;
      queue = [{ title: q, artists: '', query: q + ' audio', image: '' }];
      queueIndex = 0;
      playQueueIndex(0, true);
      setHint('YouTube 검색 결과를 재생합니다.');
    }
  });

  // 시크바/타이머
  function setupProgressTimer(){
    if(progressTimer) clearInterval(progressTimer);
    progressTimer = setInterval(() => {
      if(!ytPlayer) return;
      const d = ytPlayer.getDuration() || 0;
      const c = ytPlayer.getCurrentTime() || 0;
      $('#curTime').textContent = formatTime(c);
      $('#durTime').textContent = formatTime(d);
      const ratio = d ? Math.min(100, Math.max(0, (c/d)*100)) : 0;
      $('#seek').value = String(Math.floor(ratio));
    }, 500);
  }
  $('#seek').addEventListener('input', (e) => {
    const v = Number(e.target.value);
    if(ytPlayer){
      const d = ytPlayer.getDuration() || 0;
      ytPlayer.seekTo(d * (v/100), true);
    }
  });

  // 이벤트 바인딩
  $('#loginBtn').addEventListener('click', login);
  $('#logoutBtn').addEventListener('click', logout);

  // Firebase 이벤트 바인딩
  $('#firebaseLoginBtn').addEventListener('click', () => {
    window.location.hash = 'auth';
    showLoginModal();
  });
  document.getElementById('firebaseLogoutBtn').addEventListener('click', firebaseLogout);
  
  // URL 해시 변경 시 모달 감지
  window.addEventListener('hashchange', () => {
    if (window.location.hash === '#auth') {
        showLoginModal();
    }
  });

  // 초기 실행
  parseHashParams();
  setTabs('playlists');
  checkHashAndShowModal(); // 초기 로드 시 #auth 해시 확인

</script>
</body>
</html>
