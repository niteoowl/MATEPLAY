<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Music Hub — Spotify + YouTube</title>
  <style>
    :root{
      --bg:#0f1115;
      --panel:#151823;
      --panel-2:#1b2030;
      --accent:#1ed760; /* Spotify 그린 */
      --muted:#96a0b5;
      --text:#eef2ff;
      --danger:#ff5d5d;
      --shadow:0 10px 30px rgba(0,0,0,0.35);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;background:linear-gradient(180deg,#0b0e14 0%, #0f1115 40%, #0f1115 100%);
      color:var(--text); font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Apple SD Gothic Neo, Noto Sans KR, sans-serif;
      overflow:hidden;
    }
    /* 상단 앱바 */
    .appbar{
      position:sticky; top:0; z-index:10;
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 16px; background:rgba(15,17,21,0.8); backdrop-filter: blur(10px); border-bottom:1px solid rgba(255,255,255,0.06);
    }
    /* 로고만 남기도록 수정 */
    .brand{display:flex; align-items:center; font-weight:700; letter-spacing:0.2px}
    
    .badge{
      font-size:11px; padding:2px 8px; border-radius:999px; background:var(--panel-2); color:var(--muted);
      border:1px solid rgba(255,255,255,0.06);
    }
    
    /* === 인증 영역 CSS === */
    .auth-area {
      display: flex;
      align-items: center;
      gap: 12px; 
    }

    .login-btn, .logout-btn{
      appearance:none; border:none; outline:none;
      font-weight:700;
      padding:10px 14px; border-radius:12px;
      white-space:nowrap; cursor:pointer; transition:transform 0.1s;
    }
    /* Spotify/Firebase 일반 로그인 버튼 */
    .login-btn{
      background:var(--accent); color:#0a0d12;
      box-shadow:0 6px 20px rgba(30,215,96,0.3);
    }
    .login-btn:hover { transform: translateY(-1px); }

    /* Spotify 일반 로그아웃 버튼 */
    .logout-btn{ 
      background:var(--panel-2); color:var(--text); 
      box-shadow:var(--shadow); 
      border:1px solid rgba(255,255,255,0.06);
    }
    .logout-btn:hover { transform: translateY(-1px); }

    /* Firebase 사용자 정보 (예쁜 칩 스타일) */
    #userInfo {
        background: var(--panel-2);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 999px; /* 완전 둥글게 */
        padding: 4px 6px 4px 14px; /* 왼쪽 텍스트 공간 확보 */
        box-shadow:var(--shadow);
        display: flex;
        align-items: center;
        gap: 8px; /* 내부 요소 간격 */
    }
    #userEmail {
        font-size: 13px;
        font-weight: 500;
        color: var(--text);
        max-width: 120px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    /* Firebase 칩 내부의 로그아웃 버튼 */
    #firebaseLogoutBtn {
        /* 기존 스타일 상속 방지 */
        appearance:none; border:none; outline:none;
        cursor: pointer; transition: transform 0.1s;

        /* 디자인 변경 */
        padding: 4px 8px;
        font-size: 12px;
        font-weight: 700;
        border-radius: 999px;
        background: var(--danger); /* 빨간색으로 시각적 강조 */
        color: white;
        box-shadow: none; 
    }
    /* === 인증 영역 CSS 끝 === */


    /* 레이아웃 */
    .container{
      display:grid; grid-template-rows:auto 1fr auto; height:100%;
    }
    .content{
      display:grid; grid-template-rows:auto auto 1fr; gap:0px; padding:12px; height:calc(100vh - 160px);
    }

    /* 검색/탭 */
    .controls{
      display:flex; gap:10px; align-items:center; overflow:auto; padding:4px 2px;
      margin-bottom:8px;
    }
    .pill{
      white-space:nowrap; padding:8px 12px; border-radius:999px; background:var(--panel);
      border:1px solid rgba(255,255,255,0.06); color:var(--muted); font-size:13px;
      cursor:pointer;
    }
    .pill.active{ background:#1ed76022; color:var(--text); border-color:#1ed76055 }

    .search{
      flex:1; display:flex; gap:8px; align-items:center; background:var(--panel);
      border:1px solid rgba(255,255,255,0.06); border-radius:12px; padding:8px 10px;
    }
    .search input{
      flex:1; border:none; outline:none; background:transparent; color:var(--text);
      font-size:14px;
    }

    /* 리스트 영역 */
    .grid{
      overflow:auto; padding-bottom:12px;
    }
    /* === [개선] 현재 뷰 헤더 스타일 === */
    #currentViewHeader{
        font-weight:700; margin:6px 6px 10px; color:#dbe3ff; font-size:16px;
        display:flex; align-items:center; padding:4px 0;
    }
    /* === [개선] 현재 뷰 헤더 스타일 끝 === */
    .section-title{
        font-weight:700; margin:6px 6px 10px; color:#dbe3ff; font-size:14px;
    }
    .card{
      display:flex; gap:12px; align-items:center; background:var(--panel);
      border:1px solid rgba(255,255,255,0.06); border-radius:14px; padding:12px; margin:6px;
      cursor:pointer; transition:transform .15s ease, background .15s ease, border-color .15s ease;
    }
    .card:hover{ transform:translateY(-1px); border-color:#1ed76055; background:#161a26 }
    .thumb{
      width:52px; height:52px; border-radius:8px; background:#222837; flex:0 0 52px; overflow:hidden; display:grid; place-items:center; color:#7f8bad;
      border:1px solid rgba(255,255,255,0.06);
    }
    .meta{ flex:1; min-width:0 }
    .title{
      font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .subtitle{
      color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      margin-top:2px;
    }
    .chip{
      font-size:11px; color:#a7b0c6; background:#22283a; padding:2px 8px; border-radius:999px; border:1px solid rgba(255,255,255,0.06);
    }
    
    /* 검색 결과 저장 버튼 스타일 */
    .save-btn{
      margin-left:auto; /* 오른쪽 끝으로 이동 */
      background:var(--panel-2); color:var(--accent);
      width:38px; height:38px; border-radius:10px; /* 버튼 크기를 크게 조정 */
      display:grid; place-items:center; flex-shrink: 0;
      transition: background 0.15s;
      border:none; /* 버튼 테두리 제거 */
    }
    .save-btn:hover {
        background: rgba(30,215,96,0.1); /* hover 시 연한 녹색 배경 */
    }


    /* 플레이어 바 */
    .player{
      position:fixed; left:0; right:0; bottom:0; background:rgba(15,17,21,0.9); backdrop-filter: blur(10px);
      border-top:1px solid rgba(255,255,255,0.06);
      padding:10px 12px; display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center;
    }
    .now{
      display:flex; align-items:center; gap:10px; min-width:0;
    }
    .now .thumb{ width:48px; height:48px }
    .now .title{ font-size:13px }
    .now .subtitle{ font-size:11px }

    .controls-row{
      display:flex; align-items:center; gap:10px;
    }
    .btn{
      appearance:none; border:none; outline:none; background:#232a3d; color:var(--text);
      border:1px solid rgba(255,255,255,0.06); width:38px; height:38px; border-radius:10px;
      display:grid; place-items:center; cursor:pointer;
      transition: background 0.1s;
    }
    .btn:hover{ background:#2e3549; }
    .btn.primary{ background:var(--accent); color:#0a0d12; font-weight:800; border:none; }
    .btn.primary:hover{ background:#18a34b; }
    .time{
      display:flex; align-items:center; gap:8px; color:#aeb6cc; font-size:11px; margin-top:6px;
    }
    .seek{
      appearance:none; width:100%; height:6px; border-radius:999px; background:#232a3d; outline:none;
    }
    .seek::-webkit-slider-thumb{
      -webkit-appearance:none; appearance:none; width:14px; height:14px; border-radius:50%; background:var(--accent); border:2px solid #0a0d12;
      margin-top:-4px;
    }

    /* 유틸 */
    .hidden{ display:none !important }
    .err{ color:var(--danger); font-size:12px; margin:8px 6px 0 }
    .hint{ color:#a7b0c6; font-size:12px; margin:6px }
    /* 스크롤 스타일 */
    .grid::-webkit-scrollbar, .content::-webkit-scrollbar, .modal-list-container::-webkit-scrollbar { width:8px; height:8px }
    .grid::-webkit-scrollbar-thumb, .content::-webkit-scrollbar-thumb, .modal-list-container::-webkit-scrollbar-thumb { background:#2a3246; border-radius:999px }

    /* === [추가] 플레이리스트 선택 모달 스타일 === */
    .modal-overlay {
      position:fixed; top:0; left:0; right:0; bottom:0;
      background:rgba(0,0,0,0.8); z-index:20;
      display:flex; justify-content:center; align-items:center;
      padding:20px;
    }
    .modal-content {
      background:var(--panel); border-radius:18px; padding:20px;
      width:100%; max-width:400px; max-height:80vh; overflow:hidden;
      box-shadow:var(--shadow);
      display:flex; flex-direction:column;
    }
    .modal-title { font-size:18px; font-weight:700; margin:0 0 4px; color:var(--text); }
    .modal-subtitle { color:var(--accent); font-size:14px; margin:0 0 15px; font-weight:600;}
    .modal-list-container {
      overflow-y:auto; flex:1; margin-bottom:15px;
      border-top:1px solid rgba(255,255,255,0.06); padding-top:10px;
    }
    .modal-actions { text-align:right }
    .modal-list-item {
      display:flex; justify-content:space-between; align-items:center;
      padding:12px; border-radius:10px; cursor:pointer;
      transition:background 0.1s; margin-bottom:4px;
      border:1px solid transparent;
    }
    .modal-list-item:hover { background:var(--panel-2); border-color:#1ed76033; }
    .modal-list-item .name { font-size:14px; font-weight:500; }
    .modal-list-item .count { font-size:12px; color:var(--muted); }
    .loading-spinner { /* Placeholder for a simple loading indicator */
      margin:20px auto; width:30px; height:30px; border:4px solid rgba(255,255,255,0.2);
      border-top:4px solid var(--accent); border-radius:50%; animation:spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform:rotate(0deg); } 100% { transform:rotate(360deg); } }
    /* === 플레이리스트 선택 모달 스타일 끝 === */
  </style>
</head>
<body>

<div class="container" id="mainContainer">

  <div class="appbar">
    <div class="brand">
      <!-- 로고 이미지로 대체 -->
      <img src="https://i.postimg.cc/430bTY3C/image.png" alt="Music Hub Logo" style="height:30px; border-radius:6px;">
    </div>
    <!-- 인증 영역 (Spotify + Firebase) -->
    <div class="auth-area">
      <!-- Spotify Auth -->
      <div>
        <button id="loginBtn" class="login-btn">Spotify 로그인</button>
        <button id="logoutBtn" class="logout-btn hidden">Spotify 로그아웃</button>
      </div>
      <!-- Firebase Auth (개선된 칩 스타일) -->
      <div id="firebaseAuthControl" style="display:flex; align-items:center;">
        <button id="firebaseLoginBtn" class="login-btn">로그인</button> 
        <div id="userInfo" class="hidden">
          <span id="userEmail"></span>
          <button id="firebaseLogoutBtn">로그아웃</button>
        </div>
      </div>
    </div>
  </div>

  <div class="content">
    <div class="controls">
        <div id="tabPlaylists" class="pill active">플레이리스트</div>
        <div id="tabLiked" class="pill">좋아요한 트랙</div>
        <div id="tabRec" class="pill">추천 트랙</div>
        <div class="search">
            <!-- 검색 아이콘에 ID 추가 및 클릭 이벤트 바인딩 -->
            <svg id="searchIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="searchInput" placeholder="Spotify에서 트랙 검색..." />
        </div>
    </div>

    <div id="errorBox" class="err hidden"></div>
    <div id="hintBox" class="hint">Spotify에서 가져온 항목을 누르면 YouTube에서 자동 검색해 재생합니다.</div>
    
    <!-- === [개선] 현재 뷰 헤더 (플레이리스트 상세 보기 등에 사용) === -->
    <div id="currentViewHeader" class="section-title hidden"></div>
    <!-- ========================================================= -->

    <div id="list" class="grid" role="list" data-current-view="playlists"></div>
  </div>

  <div class="player">
    <div class="now">
        <div id="nowThumb" class="thumb">🎶</div>
        <div class="meta">
            <div id="nowTitle" class="title">—</div>
            <div id="nowSubtitle" class="subtitle">재생할 항목을 선택하세요</div>
        </div>
    </div>
    <div style="flex:1; min-width:0">
        <div class="controls-row">
            <button id="prevBtn" class="btn">⏮</button>
            <button id="playPauseBtn" class="btn primary">▶</button>
            <button id="nextBtn" class="btn">⏭</button>
            <button id="muteBtn" class="btn">🔊</button>
        </div>
        <div class="time">
            <span id="curTime">0:00</span>
            <input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="재생 위치" />
            <span id="durTime">0:00</span>
        </div>
    </div>
  </div>
</div>

<!-- === [추가] 플레이리스트 선택 모달 === -->
<div id="playlistSelectionModal" class="modal-overlay hidden">
  <div class="modal-content">
    <h3 id="modalTitle" class="modal-title">플레이리스트에 추가</h3>
    <p id="modalTrackName" class="modal-subtitle">트랙 이름</p>
    <div id="playlistListContainer" class="modal-list-container">
      <div class="loading-spinner"></div>
    </div>
    <div class="modal-actions">
      <button id="modalCloseBtn" class="logout-btn">닫기</button>
    </div>
  </div>
</div>
<!-- ================================== -->

<!-- YouTube IFrame API & Application Logic -->
<script type="module">
  // Firebase SDKs Import
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
  import { getAuth, onAuthStateChanged, signInWithCustomToken, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

  // -------------------------
  // 🔑 Spotify PKCE 인증 설정 🔑
  // -------------------------
  const SPOTIFY_CLIENT_ID = '9841b0890ed6400cb6d8fdb0692c102f'; 
  const SPOTIFY_REDIRECT_URI = 'https://play.nmate.kr/callback'; 
  // 플레이리스트 수정을 위한 스코프를 유지합니다.
  const SPOTIFY_SCOPES = [
    'user-read-email',
    'playlist-read-private',
    'user-library-read',
    'playlist-modify-public', 
    'playlist-modify-private',
    'user-library-modify'
  ].join(' ');
  // ⚠️ YouTube API Key: 403 오류 발생 시 이 값을 교체해야 합니다.
  const YT_API_KEY = 'AIzaSyAIhw6pfhduLDZRdv5FqzddSBqHjMQQzEE'; 

  // 토큰/상태
  let accessToken = null;
  let expiresAt = 0;

  // 재생 큐
  let queue = [];
  let queueIndex = -1;

  // YouTube 플레이어
  let ytPlayer = null;
  let ytReady = false;
  let progressTimer = null;
  
  // 플레이리스트 모달용 캐시
  let modifiablePlaylists = [];
  let isPlaylistsLoading = false;


  // -------------------------
  // 🔐 PKCE 유틸리티 함수 🔐
  // -------------------------

  function generateRandomString(length) {
    let text = '';
    const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    for (let i = 0; i < length; i++) {
        text += possible.charAt(Math.floor(Math.random() * possible.length));
    }
    return text;
  }

  async function sha256(plain) {
    const encoder = new TextEncoder();
    const data = encoder.encode(plain);
    return window.crypto.subtle.digest('SHA-256', data);
  }

  function base64urlencode(a) {
    return btoa(String.fromCharCode.apply(null, new Uint8Array(a)))
        .replace(/\+/g, '-')
        .replace(/\//g, '_')
        .replace(/=+$/, '');
  }

  async function generateCodeChallenge(v) {
    const hashed = await sha256(v);
    return base64urlencode(hashed);
  }

  // -------------------------
  // 🛠️ 공통 로드 함수 🛠️
  // -------------------------

  /**
   * Spotify 토큰과 Firebase 사용자 인증이 모두 완료되었는지 확인하고
   * 완료되었다면 플레이리스트를 로드합니다.
   */
  function checkAndLoadData() {
    if (currentFirebaseUser && accessToken) {
        setTabs('playlists');
        $('#list').setAttribute('data-current-view', 'playlists');
        loadPlaylists(); // 데이터 로드 시작
        return true;
    }
    return false;
  }


  // -------------------------
  // 🎵 Firebase Auth Integration 🎵
  // -------------------------

  // Firebase 설정
  const FIREBASE_CONFIG = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
    apiKey: "AIzaSyC2iRkFZUYZsVIbGzXcCLY1t4eBcfzvwzg",
    authDomain: "mateplay-a.firebaseapp.com",
    projectId: "mateplay-a",
    storageBucket: "mateplay-a.firebasestorage.app",
    messagingSenderId: "828604405793",
    appId: "1:828604405793:web:aaaa2020fcc44c7d1cab60",
    measurementId: "G-SHSQRWSLJL"
  };

  let firebaseApp;
  let auth;
  let currentFirebaseUser = null;
  const initialAuthToken = typeof __initial_auth_token === 'string' ? __initial_auth_token : null; 

  async function initializeFirebase() {
    try {
        firebaseApp = initializeApp(FIREBASE_CONFIG);
        auth = getAuth(firebaseApp);

        if (initialAuthToken) {
            try {
                await signInWithCustomToken(auth, initialAuthToken);
                console.log("Custom token sign-in successful.");
            } catch (error) {
                console.error("Custom token sign-in failed:", error);
                setError("자동 로그인에 실패했습니다. (유효하지 않은 토큰)"); 
            }
        } else {
             console.log("No initial custom token provided.");
        }
        
        // Auth State Listener 설정
        onAuthStateChanged(auth, (user) => {
            currentFirebaseUser = user;
            updateFirebaseAuthUI(user);
            // Firebase 로그인 상태가 확인되면 (초기화 후) Spotify 토큰 여부를 확인하고 데이터 로드를 시도합니다.
            checkAndLoadData();
        });

    } catch(e) {
      console.error("Firebase initialization failed:", e);
      setError('Firebase 초기화 실패: ' + e.message);
    }
  }

  function updateFirebaseAuthUI(user) {
    const userInfoEl = document.getElementById('userInfo');
    const loginBtnEl = document.getElementById('firebaseLoginBtn');
    const userEmailEl = document.getElementById('userEmail');

    if (user) {
      userInfoEl.classList.remove('hidden');
      loginBtnEl.classList.add('hidden');
      userEmailEl.textContent = user.email || user.uid.substring(0, 8) + '...';
    } else {
      userInfoEl.classList.add('hidden');
      loginBtnEl.classList.remove('hidden');
      userEmailEl.textContent = '';
    }
  }

  async function firebaseLogout() {
    try {
      await signOut(auth);
      setError('Firebase에서 로그아웃되었습니다.');
    } catch(e) {
      setError('로그아웃 오류: ' + e.message);
    }
  }


  // -------------------------
  // 🎵 기존 애플리케이션 로직 🎵
  // -------------------------

  // 유틸
  const $ = sel => document.querySelector(sel);
  const $$ = sel => document.querySelectorAll(sel);

  function formatTime(sec){
    if(!isFinite(sec) || sec < 0) return '0:00';
    const m = Math.floor(sec/60), s = Math.floor(sec%60);
    return `${m}:${s.toString().padStart(2,'0')}`;
  }
  
  // 메인 페이지 에러/힌트
  function setError(msg){
    const box = $('#errorBox');
    box.textContent = msg || '';
    box.classList.toggle('hidden', !msg);
  }
  function setHint(msg){
    const box = $('#hintBox');
    box.textContent = msg || '';
    box.classList.toggle('hidden', !msg);
  }

  // -------------------------
  // 🔄 Spotify PKCE Login (Step 1) 🔄
  // -------------------------
  async function login(){
    setError(''); 
    
    const codeVerifier = generateRandomString(128);
    // [유지] sessionStorage 사용
    sessionStorage.setItem('spotify_code_verifier', codeVerifier); 
    
    const codeChallenge = await generateCodeChallenge(codeVerifier);

    const authUrl = new URL('https://accounts.spotify.com/authorize');
    authUrl.searchParams.set('client_id', SPOTIFY_CLIENT_ID);
    authUrl.searchParams.set('response_type', 'code'); 
    authUrl.searchParams.set('redirect_uri', SPOTIFY_REDIRECT_URI);
    authUrl.searchParams.set('scope', SPOTIFY_SCOPES);
    authUrl.searchParams.set('code_challenge_method', 'S256'); 
    authUrl.searchParams.set('code_challenge', codeChallenge); 
    authUrl.searchParams.set('show_dialog', 'true');
    window.location.href = authUrl.toString();
  }

  // -------------------------
  // 🔄 Spotify PKCE Callback (Step 2: Token 수신 및 처리) 🔄
  // -------------------------
  async function handleSpotifyCallback(){
    // ⭐ URL Fragment (#)와 Query String (?) 모두에서 토큰 정보를 찾습니다.
    const urlParts = new URLSearchParams(window.location.hash.substring(1));
    const code = new URLSearchParams(window.location.search).get('code'); 
    const token = urlParts.get('access_token');
    const expiry = urlParts.get('expires_in');
    
    // 이전 콜백 코드 (Spotify -> empty_canvas.html)가 남아있을 경우 제거
    if(code) {
        window.history.replaceState({}, document.title, window.location.pathname);
        return false;
    }
    
    // 1. Fragment에 토큰이 있는지 확인 (empty_canvas.html의 성공적인 리디렉션 결과)
    if (token) {
        accessToken = token;
        expiresAt = Date.now() + (parseInt(expiry, 10) * 1000); 
        
        // URL Fragment 정리
        window.history.replaceState({}, document.title, window.location.pathname);
        
        $('#loginBtn').classList.add('hidden');
        $('#logoutBtn').classList.remove('hidden');
        
        // Spotify 토큰을 성공적으로 받은 후, 데이터 로드를 시도합니다.
        checkAndLoadData();
        
        setHint('✅ Spotify 인증 성공! (플레이리스트 수정 권한 포함)');
        return true;
    }

    // 2. Fragment에 토큰이 없으면 로그인 버튼 표시
    return false;
  }
  
  function logout(){
    accessToken = null; expiresAt = 0;
    $('#loginBtn').classList.remove('hidden');
    $('#logoutBtn').classList.add('hidden');
    $('#list').innerHTML = '';
    modifiablePlaylists = []; // 캐시 클리어
    setHint('로그아웃되었습니다. 다시 로그인해 주세요.');
  }

  async function spotify(endpoint, params){
    if(!accessToken || Date.now() > expiresAt){ throw new Error('인증이 만료되었습니다. 다시 로그인해 주세요.'); }
    const url = new URL('https://api.spotify.com/v1' + endpoint);
    if(params){ Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v)); }
    const res = await fetch(url, { headers: { Authorization: 'Bearer ' + accessToken } });
    if(!res.ok){
      const t = await res.text().catch(()=> '');
      throw new Error('Spotify 오류: ' + res.status + ' ' + (t.substring(0, 100) || res.statusText));
    }
    return res.json();
  }

  /**
   * 플레이리스트 클릭 시 호출됨. 트랙 목록을 로드하고 뷰를 전환합니다.
   * @param {string} plId 플레이리스트 ID
   * @param {string} plName 플레이리스트 이름
   */
  async function loadPlaylistTracks(plId, plName){
    if (!accessToken) {
        setError('Spotify 인증이 필요합니다.');
        return;
    }
    try{
        $('#list').setAttribute('data-current-view', 'playlist-tracks');
        setViewHeader(`플레이리스트: <b>${plName}</b>`, true); // 뒤로가기 버튼과 제목 설정
        setHint(`'${plName}'의 트랙을 불러오는 중...`);
        const data = await spotify(`/playlists/${plId}/tracks`, { limit: 100 });
        
        const tracks = (data.items||[])
            .filter(i => i.track && i.track.name)
            .map(i => i.track);
            
        renderList(tracks, 'playlist-track'); // 타입 변경: 'playlist-track'
        
        setHint(`'${plName}' (${tracks.length}곡) | 트랙을 누르면 YouTube에서 재생됩니다.`);
        
    }catch(e){ 
        setError('플레이리스트 트랙 로드 오류: ' + e.message); 
        setHint('');
    }

  // --- 플레이리스트 추가 모달 로직 ---
  
  /**
   * 사용자가 수정 가능한 플레이리스트 목록을 가져옵니다. (캐시 사용)
   */
  async function fetchUserModifiablePlaylists() {
    if (modifiablePlaylists.length > 0 && !isPlaylistsLoading) {
        return modifiablePlaylists;
    }
    if (isPlaylistsLoading) return []; 
    
    isPlaylistsLoading = true;
    try {
        // me/playlists 엔드포인트는 내가 소유하거나 팔로우하는 모든 플레이리스트를 반환합니다.
        const data = await spotify('/me/playlists', { limit: 50 });
        
        // 현재 사용자 ID
        const currentUserSpotifyId = currentFirebaseUser?.uid; // Spotify ID는 Spotify API 호출로 가져와야 하지만, 편의상 Firebase UID를 사용한다고 가정

        // 내가 만들었거나 (owner.id === user.id) 또는 공동 작업 가능한 (collaborative: true) 플레이리스트를 필터링
        const playlists = (data.items || []).filter(p => p.owner?.id === currentUserSpotifyId || p.collaborative || p.owner?.display_name === "사용자 이름");
        
        // 실제 Spotify User ID를 가져오는 로직 추가 (첫 로그인 시에만 실행)
        let userId = '';
        try {
            const meData = await spotify('/me');
            userId = meData.id;
        } catch(e) { /* 무시 */ }

        const finalPlaylists = (data.items || []).filter(p => p.owner?.id === userId || p.collaborative);

        modifiablePlaylists = finalPlaylists;
        return finalPlaylists;
    } catch (e) {
        setError('플레이리스트 목록 로드 오류: ' + e.message);
        return [];
    } finally {
        isPlaylistsLoading = false;
    }
  }

  /**
   * 플레이리스트 선택 모달을 표시합니다.
   */
  function showPlaylistSelectionModal(trackId, trackTitle) {
      const modal = $('#playlistSelectionModal');
      const titleEl = $('#modalTrackName');
      const listContainer = $('#playlistListContainer');
      
      titleEl.textContent = `트랙: ${trackTitle}`;
      modal.classList.remove('hidden');
      
      listContainer.innerHTML = '<div class="loading-spinner"></div>';
      
      fetchUserModifiablePlaylists().then(playlists => {
          listContainer.innerHTML = '';
          if(playlists.length === 0) {
              listContainer.innerHTML = `<div class="hint" style="margin:12px">수정 가능한 플레이리스트가 없습니다.</div>`;
              return;
          }

          playlists.forEach(pl => {
              const item = document.createElement('div');
              item.className = 'modal-list-item';
              item.innerHTML = `<span class="name">${pl.name}</span><span class="count">${pl.tracks.total}곡</span>`;
              item.addEventListener('click', () => {
                  addTrackToPlaylist(trackId, pl.id, pl.name);
                  modal.classList.add('hidden');
              });
              listContainer.appendChild(item);
          });
          
          // 좋아요한 트랙에 추가하는 옵션도 제공
          const likedSongsItem = document.createElement('div');
          likedSongsItem.className = 'modal-list-item';
          likedSongsItem.style.fontWeight = 'bold';
          likedSongsItem.innerHTML = `<span class="name" style="color:var(--accent)">❤ 좋아요한 트랙</span><span class="count">바로 추가</span>`;
          likedSongsItem.addEventListener('click', () => {
              addTrackToLikedSongs(trackId, trackTitle);
              modal.classList.add('hidden');
          });
          listContainer.prepend(likedSongsItem);
          
      });
  }
  
  /**
   * 특정 트랙을 좋아요한 트랙에 추가합니다.
   */
  async function addTrackToLikedSongs(trackId, trackName){
    if (!accessToken) { setError('Spotify 인증이 필요합니다.'); return; }
    try{
        setHint(`'${trackName}'을(를) 보관함(Liked Songs)에 추가 중...`);
        // user-library-modify 스코프 필요
        const res = await fetch(`https://api.spotify.com/v1/me/tracks?ids=${trackId}`, {
            method: 'PUT',
            headers: { 'Authorization': 'Bearer ' + accessToken },
        });
        
        if(res.ok || res.status === 200 || res.status === 204){
            setHint(`✅ '${trackName}'이(가) 내 좋아요한 트랙에 성공적으로 추가되었습니다!`);
        } else {
            const errText = await res.text().catch(()=>'');
            throw new Error(`(${res.status}) ${errText || '추가 실패'}`);
        }
    }catch(e){
        setError(`트랙 저장 오류: ${e.message}`);
    }
  }


  /**
   * 특정 트랙을 선택된 플레이리스트에 추가합니다.
   */
  async function addTrackToPlaylist(trackId, playlistId, playlistName) {
      if (!accessToken) { setError('Spotify 인증이 필요합니다.'); return; }
      try{
          setHint(`'${playlistName}' 플레이리스트에 트랙을 추가 중...`);
          const trackUri = `spotify:track:${trackId}`;
          
          const res = await fetch(`https://api.spotify.com/v1/playlists/${playlistId}/tracks`, {
              method: 'POST',
              headers: { 
                  'Authorization': 'Bearer ' + accessToken,
                  'Content-Type': 'application/json'
              },
              body: JSON.stringify({ uris: [trackUri] })
          });
          
          if(res.ok || res.status === 200 || res.status === 201){
              setHint(`✅ 트랙이 '<b>${playlistName}</b>'에 성공적으로 추가되었습니다!`);
              // 캐시 클리어 (다음 로드 시 갱신된 정보로 불러옴)
              modifiablePlaylists = [];
          } else {
              const errText = await res.text().catch(()=>'');
              throw new Error(`(${res.status}) ${errText || '추가 실패'}`);
          }
      }catch(e){
          setError(`플레이리스트 추가 오류: ${e.message}`);
      }
  }
  

  /**
   * 리스트를 렌더링합니다. 'search-track' 타입일 경우 저장 버튼을 추가합니다.
   * @param {Array} items 표시할 항목 배열
   * @param {('playlist'|'playlist-track'|'search-track')} type 항목의 타입
   */
  function renderList(items, type){
    const root = $('#list');
    root.innerHTML = '';
    if(!items || !items.length){
      root.innerHTML = `<div class="hint" style="margin:12px">항목이 비어 있습니다.</div>`;
      return;
    }
    const frag = document.createDocumentFragment();
    items.forEach((it, idx) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.setAttribute('role', 'listitem');
      card.addEventListener('click', () => onItemClick(it, type));

      const thumb = document.createElement('div');
      thumb.className = 'thumb';
      let imageUrl = '';
      if(type === 'playlist' && it.images?.[0]?.url){
        imageUrl = it.images[0].url;
      }else if((type === 'playlist-track' || type === 'search-track') && it.album?.images?.[0]?.url){
        imageUrl = it.album.images[0].url;
      }
      
      if(imageUrl){
        thumb.style.backgroundImage = `url(${imageUrl})`;
        thumb.style.backgroundSize = 'cover';
        thumb.textContent = '';
      }else{
        thumb.textContent = type === 'playlist' ? '💿' : '🎵';
      }

      const meta = document.createElement('div');
      meta.className = 'meta';
      const t = document.createElement('div');
      t.className = 'title';
      t.textContent = it.name || it.track?.name || '제목 없음';

      const s = document.createElement('div');
      s.className = 'subtitle';
      if(type === 'playlist'){
        s.textContent = `${(it.tracks?.total||0)}곡 · ${it.owner?.display_name||'—'}`;
      }else{
        const trackItem = it.track || it;
        const artists = (trackItem.artists || []).map(a=>a.name).join(', ');
        const album = trackItem.album?.name || '';
        s.textContent = `${artists}${album ? ' · ' + album : ''}`;
      }

      const chip = document.createElement('span');
      chip.className = 'chip';
      // === [개선] 칩 텍스트 변경: 뷰에 따라 더 명확하게 표시 ===
      chip.textContent = type === 'playlist' ? 'Playlist' : 
                         (type === 'search-track' ? 'Search Track' : 'Playlist Track'); 
      // =======================================================

      meta.appendChild(t); meta.appendChild(s);
      card.appendChild(thumb);
      card.appendChild(meta);
      
      // [새로운 로직] 검색 결과 트랙인 경우 플레이리스트 추가 버튼 추가
      if(type === 'search-track'){
          const saveBtn = document.createElement('button');
          saveBtn.className = 'btn save-btn';
          // '+' 아이콘으로 변경
          saveBtn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>`;
          saveBtn.title = '플레이리스트에 추가';
          saveBtn.addEventListener('click', (e) => {
              e.stopPropagation(); // 카드 클릭 시 트랙 재생 방지
              const trackItem = it.track || it;
              const artists = (trackItem.artists || []).map(a=>a.name).join(', ');
              showPlaylistSelectionModal(trackItem.id, `${trackItem.name} - ${artists}`); 
          });
          card.appendChild(saveBtn); 
      }
      
      card.appendChild(chip);

      frag.appendChild(card);
    });
    root.appendChild(frag);
  }

  /**
   * 리스트 항목 클릭 이벤트 핸들러. 플레이리스트는 상세 트랙 로드를 호출합니다.
   * @param {*} item 클릭된 항목 데이터
   * @param {string} type 항목 타입
   */
  async function onItemClick(item, type){
    try{
      if(type === 'playlist'){
        // 플레이리스트 클릭 시, 바로 재생하지 않고 트랙 목록 로드
        loadPlaylistTracks(item.id, item.name);
      } else if (type === 'playlist-track' || type === 'search-track') {
        // 트랙 또는 검색 결과 트랙 클릭 시 재생
        const trackItem = item.track || item;
        queue = [toQueueItem(trackItem)];
        queueIndex = 0;
        playQueueIndex(0, true);
      }
    }catch(e){ setError(e.message); }
  }


  function toQueueItem(t){
    const title = t.name || '제목 없음';
    const artists = (t.artists||[]).map(a=>a.name).join(', ');
    const query = `${title} ${artists} audio`;
    const image = t.album?.images?.[0]?.url || '';
    return { title, artists, query, image };
  }

  async function playQueueIndex(idx, autoplay){
    if(idx < 0 || idx >= queue.length) return;
    const it = queue[idx];
    setNowPlaying(it);
    try{
      const vid = await ytSearchFirstVideo(it.query);
      if(!vid){ setError('YouTube 검색 결과가 없습니다.'); return; }
      ensureYTPlayer();
      if(ytReady){
        ytPlayer.loadVideoById(vid);
        if(!autoplay){ ytPlayer.pauseVideo(); }
      }else{
        const timer = setInterval(() => {
          if(ytReady){
            clearInterval(timer);
            ytPlayer.loadVideoById(vid);
            if(!autoplay){ ytPlayer.pauseVideo(); }
          }
        }, 150);
      }
    }catch(e){ setError('YouTube 재생 오류: ' + e.message); }
  }

  function setNowPlaying(it){
    $('#nowTitle').textContent = it.title;
    $('#nowSubtitle').textContent = it.artists || '—';
    const n = $('#nowThumb');
    if(it.image){
      n.style.backgroundImage = `url(${it.image})`;
      n.style.backgroundSize = 'cover';
      n.textContent = '';
    }else{
      n.style.backgroundImage = '';
      n.textContent = '🎵';
    }
  }

  async function ytSearchFirstVideo(q){
    const url = new URL('https://www.googleapis.com/youtube/v3/search');
    url.searchParams.set('part','snippet');
    url.searchParams.set('q', q);
    url.searchParams.set('type','video');
    url.searchParams.set('videoCategoryId','10'); // Music
    url.searchParams.set('maxResults','1');
    url.searchParams.set('key', YT_API_KEY);
    
    // ⚠️ 오류 발생 시 로그 확인: 403 오류는 API 키 문제이거나 할당량을 초과했을 수 있습니다.
    console.log(`Youtube Query: ${q}`);
    
    const res = await fetch(url);
    if(!res.ok){ 
        const errorText = await res.text().catch(() => 'Unknown error');
        console.error("YouTube Search Failed:", res.status, errorText);
        throw new Error(`YouTube API 오류: ${res.status} (키/할당량 문제일 수 있음)`); 
    }
    const j = await res.json();
    return j.items?.[0]?.id?.videoId || null;
  }

  function ensureYTPlayer(){
    if(ytPlayer) return;
    if(!window.YT){
      const tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      document.body.appendChild(tag);
      window.onYouTubeIframeAPIReady = createPlayer;
    }else{
      createPlayer();
    }
  }
  function createPlayer(){
    const div = document.createElement('div');
    div.id = 'yt-iframe';
    div.style.position='fixed'; div.style.left='-9999px'; div.style.top='-9999px';
    document.body.appendChild(div);
    ytPlayer = new YT.Player('yt-iframe', {
      height: '0', width: '0', videoId: '',
      playerVars: { 'playsinline': 1 },
      events:{
        'onReady': () => {
          ytReady = true;
          setupProgressTimer();
        },
        'onStateChange': onYTStateChange,
        'onError': () => setError('YouTube 플레이어 오류가 발생했습니다.')
      }
    });
  }
  function onYTStateChange(e){
    const state = e.data;
    if(state === 1){
      $('#playPauseBtn').textContent = '⏸';
      setError('');
    }else if(state === 2 || state === 5){
      $('#playPauseBtn').textContent = '▶';
    }else if(state === 0){
      if(queueIndex < queue.length - 1){
        queueIndex++;
        playQueueIndex(queueIndex, true);
      }
    }
  }

  function setupTabListeners() {
      // 탭 클릭 시 현재 뷰 상태 변경 및 데이터 로드
      $('#tabPlaylists').addEventListener('click', () => { 
          setTabs('playlists'); 
          $('#list').setAttribute('data-current-view', 'playlists'); 
          loadPlaylists(); 
      });
      $('#tabLiked').addEventListener('click', () => { 
          setTabs('liked'); 
          $('#list').setAttribute('data-current-view', 'liked'); 
          loadLiked(); 
      });
      $('#tabRec').addEventListener('click', () => { 
          setTabs('rec'); 
          $('#list').setAttribute('data-current-view', 'rec'); 
          loadRecommendations(); 
      });
  }

  async function loadPlaylists(){
    if (!currentFirebaseUser || !accessToken) {
      setHint('Firebase 및 Spotify 인증이 필요합니다.');
      return;
    }
    try{
      setHint('플레이리스트를 불러오는 중…');
      const me = await spotify('/me');
      const data = await spotify('/me/playlists', { limit: 50 });
      renderList(data.items || [], 'playlist');
      setHint(`${me.display_name}님의 플레이리스트 | 클릭하여 상세 트랙 보기`);
    }catch(e){ setError(e.message); setHint(''); }
  }
  async function loadLiked(){
    if (!currentFirebaseUser || !accessToken) return;
    try{
      setHint('좋아요한 트랙을 불러오는 중…');
      const data = await spotify('/me/tracks', { limit: 50 });
      const tracks = (data.items || []).map(it => it.track).filter(Boolean);
      renderList(tracks, 'playlist-track'); // 'playlist-track' 타입 사용
      setHint('좋아요한 트랙 | 클릭하여 YouTube에서 재생');
    }catch(e){ setError(e.message); setHint(''); }
  }
  async function loadRecommendations(){
    if (!currentFirebaseUser || !accessToken) return;
    try{
      setHint('추천 트랙을 불러오는 중…');
      const saved = await spotify('/me/tracks', { limit: 5 });
      const seedArtists = new Set(), seedTracks = [];
      (saved.items || []).forEach(it => {
        const t = it.track; if(!t) return;
        if(t.artists?.[0]?.id) seedArtists.add(t.artists[0].id);
        if(t.id) seedTracks.push(t.id);
      });
      const params = {};
      if(seedArtists.size) params.seed_artists = Array.from(seedArtists).slice(0,2).join(',');
      if(seedTracks.length) params.seed_tracks = seedTracks.slice(0,3).join(',');
      if(!params.seed_artists && !params.seed_tracks){
        params.seed_genres = 'pop';
      }
      const rec = await spotify('/recommendations', Object.assign({ limit: 30 }, params));
      renderList(rec.tracks || [], 'playlist-track'); // 'playlist-track' 타입 사용
      setHint('맞춤형 추천 | 클릭하여 YouTube에서 재생');
    }catch(e){ setError(e.message); setHint(''); }
  }


  function setupPlayerControls() {
    $('#playPauseBtn').addEventListener('click', () => {
      if(!ytPlayer) return ensureYTPlayer();
      const st = ytPlayer.getPlayerState();
      if(st === 1){ ytPlayer.pauseVideo(); }
      else { ytPlayer.playVideo(); }
    });
    $('#prevBtn').addEventListener('click', () => {
      if(queueIndex > 0){ queueIndex--; playQueueIndex(queueIndex, true); }
    });
    $('#nextBtn').addEventListener('click', () => {
      if(queueIndex < queue.length - 1){ queueIndex++; playQueueIndex(queueIndex, true); }
    });
    $('#muteBtn').addEventListener('click', () => {
      if(!ytPlayer) return;
      if(ytPlayer.isMuted()) ytPlayer.unMute(); else ytPlayer.mute();
    });

    const searchHandler = () => {
        const q = $('#searchInput').value.trim();
        if(!q) return;
        spotifySearchTracks(q);
        setTabs('search');
    };

    $('#searchInput').addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){
        searchHandler();
      }
    });
    $('#searchIcon').addEventListener('click', searchHandler);


    $('#seek').addEventListener('input', (e) => {
      const v = Number(e.target.value);
      if(ytPlayer){
        const d = ytPlayer.getDuration() || 0;
        ytPlayer.seekTo(d * (v/100), true);
      }
    });

    // 인증 이벤트 바인딩
    $('#loginBtn').addEventListener('click', login);
    $('#logoutBtn').addEventListener('click', logout);

    // Firebase 인증 이벤트 바인딩
    $('#firebaseLoginBtn').addEventListener('click', () => {
      if (!currentFirebaseUser) {
          window.location.href = '/auth';
      }
    });
    document.getElementById('firebaseLogoutBtn').addEventListener('click', firebaseLogout);
    
    // 모달 닫기 버튼 이벤트 바인딩
    $('#modalCloseBtn').addEventListener('click', () => {
        $('#playlistSelectionModal').classList.add('hidden');
    });
  }
  
  function setupProgressTimer(){
    if(progressTimer) clearInterval(progressTimer);
    progressTimer = setInterval(() => {
      if(!ytPlayer) return;
      const d = ytPlayer.getDuration() || 0;
      const c = ytPlayer.getCurrentTime() || 0;
      $('#curTime').textContent = formatTime(c);
      $('#durTime').textContent = formatTime(d);
      const ratio = d ? Math.min(100, Math.max(0, (c/d)*100)) : 0;
      $('#seek').value = String(Math.floor(ratio));
    }, 500);
  }
  
  // -------------------------
  // 🚀 애플리케이션 초기화 🚀
  // -------------------------

  async function initApp() {
      // 1. Firebase 초기화 및 자동 로그인 시도
      await initializeFirebase(); 

      // 2. 탭 및 플레이어 컨트롤 설정 (DOM 준비 완료 후)
      setupTabListeners();
      setupPlayerControls();

      // 3. Spotify 콜백 처리 시도 (토큰 수신)
      await handleSpotifyCallback();
      
      // 4. 초기 데이터 로드 최종 확인 (Firebase, Spotify 모두 인증된 경우)
      const isReady = checkAndLoadData();
      if (!isReady) {
        // 초기 뷰를 플레이리스트로 설정
        $('#list').setAttribute('data-current-view', 'playlists');
      }
  }

  window.onload = initApp;

</script>
