<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>Spotify 계정 + YouTube 재생 (서버 콜백 전담형)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { --bg:#0b0d12; --panel:#151925; --accent:#1db954; --text:#e5e7eb; --muted:#a3a7b0; --border:#22283a; --danger:#ef4444; }
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(180deg,#0b0d12 0%,#0f1115 100%);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Apple SD Gothic Neo,Noto Sans KR,Apple Color Emoji,Segoe UI Emoji}
    header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);background:#0f1115cc;backdrop-filter:blur(6px);position:sticky;top:0;z-index:10}
    .brand{display:flex;align-items:center;gap:10px}
    .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
    .title{font-weight:700;letter-spacing:.3px}
    .actions{display:flex;gap:8px;align-items:center}
    button,.btn{background:var(--accent);color:#03130a;border:none;padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer;transition:transform .05s ease,opacity .2s}
    button:hover{opacity:.9} button:active{transform:translateY(1px)}
    .btn.secondary{background:#252b3d;color:var(--text);border:1px solid var(--border)}
    .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
    .layout{display:grid;grid-template-columns:320px 1fr 380px;gap:16px;padding:16px;min-height:calc(100vh - 64px)}
    .panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden}
    .panel h2{margin:0;padding:14px 16px;font-size:14px;letter-spacing:.3px;color:var(--muted);border-bottom:1px solid var(--border);background:#121728}
    .scroll{max-height:calc(100vh - 200px);overflow:auto}
    .item{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px dashed rgba(255,255,255,0.06);cursor:pointer}
    .item:hover{background:rgba(255,255,255,0.04)}
    .thumb{width:56px;height:56px;border-radius:8px;background:#1b2033;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;border:1px solid var(--border);overflow:hidden}
    .meta{display:flex;flex-direction:column;gap:4px}
    .meta .name{font-weight:700}
    .meta .sub{font-size:12px;color:var(--muted)}
    .pill{font-size:12px;padding:6px 10px;border-radius:999px;border:1px solid var(--border);color:var(--muted)}
    .player{position:sticky;bottom:0;background:#0f1115;border-top:1px solid var(--border);padding:10px 16px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px}
    .controls{display:flex;align-items:center;gap:8px}
    .searchbar{display:flex;gap:8px;padding:10px;border-bottom:1px solid var(--border);background:#101425}
    .searchbar input{flex:1;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:#0f1322;color:var(--text);outline:none}
    .notice{padding:10px 12px;color:var(--muted);font-size:12px;border-bottom:1px dashed var(--border)}
    .danger{color:var(--danger)}
    .yt-embed{aspect-ratio:16/9;width:100%;background:#000}
    .empty{padding:16px;color:var(--muted);font-size:14px}
    @media (max-width:1100px){.layout{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header>
  <div class="brand">
    <div class="dot"></div>
    <div class="title">nightstreet • Spotify 계정 + YouTube 재생</div>
  </div>
  <div class="actions">
    <button id="btnLogin">Spotify 로그인</button>
    <button class="btn secondary" id="btnRefresh">새로고침</button>
  </div>
</header>

<main class="layout">
  <!-- 좌측: Spotify 플레이리스트 -->
  <section class="panel" id="panelPlaylists">
    <h2>내 플레이리스트</h2>
    <div class="notice">항목을 클릭하면 같은 곡명을 YouTube에서 찾아 재생합니다.</div>
    <div class="scroll" id="playlistList"><div class="empty">로그인 후 불러옵니다.</div></div>
  </section>

  <!-- 중앙: YouTube 플레이어 -->
  <section class="panel" id="panelPlayer">
    <h2>YouTube 플레이어</h2>
    <div class="searchbar">
      <input id="ytQuery" placeholder="YouTube에서 검색할 음악 제목을 입력하세요" />
      <button class="btn" id="btnYtSearch">검색</button>
    </div>
    <div id="ytResults" class="scroll"></div>
    <div class="player">
      <div class="meta">
        <div id="nowPlaying" class="name">재생 대기 중…</div>
        <div class="sub" id="nowPlayingSub"></div>
      </div>
      <div class="controls">
        <button class="btn ghost" id="btnPrev">◀︎ 이전</button>
        <button class="btn" id="btnPlayPause">▶︎/⏸</button>
        <button class="btn ghost" id="btnNext">다음 ▶︎</button>
      </div>
    </div>
    <div id="playerContainer">
      <div id="player" class="yt-embed"></div>
    </div>
  </section>

  <!-- 우측: 개인화 추천 -->
  <section class="panel" id="panelPersonal">
    <h2>개인화 추천</h2>
    <div class="notice">Spotify 개인화 데이터를 YouTube로 매칭해 재생합니다.</div>
    <div class="scroll" id="personalList"><div class="empty">로그인 후 불러옵니다.</div></div>
  </section>
</main>

<script>
  // ===== 설정 =====
  // 실제 서비스에서는 키를 서버에서 보호하세요(도메인 제한/프록시 권장)
  const YT_API_KEY = "AIzaSyAIhw6pfhduLDZRdv5FqzddSBqHjMQQzEE"; // 제공된 키
  // Spotify는 서버 콜백이 전담하므로 CLIENT_ID/authorize URL 불필요

  // ===== 상태 =====
  let spotifyToken = null;
  let ytPlayer = null;
  let currentQueue = []; // { title, channel, videoId }
  let currentIndex = -1;

  // ===== 토큰 회수(콜백 전담) =====
  // /callback에서 access_token을 해시 또는 쿼리로 넘기거나, postMessage로 전달한다고 가정
  function readTokenFromUrl() {
    const hash = location.hash.startsWith("#") ? location.hash.slice(1) : "";
    const h = new URLSearchParams(hash);
    const t1 = h.get("access_token");

    const q = new URLSearchParams(location.search);
    const t2 = q.get("access_token");

    const token = t1 || t2;
    if (token) {
      sessionStorage.setItem("spotify_access_token", token);
      spotifyToken = token;
      const cleanUrl = location.origin + location.pathname; // 깔끔한 URL로 정리
      history.replaceState(null, "", cleanUrl);
    }
  }
  function getToken() {
    if (spotifyToken) return spotifyToken;
    const t = sessionStorage.getItem("spotify_access_token");
    if (t) spotifyToken = t;
    return spotifyToken;
  }

  // ===== Spotify API 헬퍼 =====
  async function sFetch(path, init = {}) {
    const token = getToken();
    if (!token) throw new Error("Spotify 미인증");
    const res = await fetch(`https://api.spotify.com/v1${path}`, {
      ...init,
      headers: { Authorization: `Bearer ${token}`, ...(init.headers || {}) }
    });
    if (res.status === 401) {
      sessionStorage.removeItem("spotify_access_token");
      spotifyToken = null;
      throw new Error("토큰 만료");
    }
    if (!res.ok) {
      const text = await res.text().catch(()=> "");
      throw new Error(`Spotify 오류 ${res.status}: ${text}`);
    }
    return res.json();
  }

  // ===== Spotify 데이터 =====
  async function loadPlaylists() {
    const listEl = document.getElementById("playlistList");
    listEl.innerHTML = "<div class='empty'>불러오는 중…</div>";
    let items = [];
    let next = "/me/playlists?limit=20";
    while (next) {
      const data = await sFetch(next.replace("https://api.spotify.com/v1",""));
      items = items.concat(data.items || []);
      next = data.next;
    }
    if (!items.length) {
      listEl.innerHTML = "<div class='empty'>플레이리스트가 없습니다.</div>";
      return;
    }
    listEl.innerHTML = "";
    for (const p of items) {
      const el = document.createElement("div");
      el.className = "item";
      const img = (p.images && p.images[0] && p.images[0].url) || "";
      el.innerHTML = `
        <div class="thumb">${img ? `<img src="${img}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:8px;">` : "IMG"}</div>
        <div class="meta">
          <div class="name">${escapeHtml(p.name)}</div>
          <div class="sub">${p.tracks?.total || 0}곡 • by ${escapeHtml(p.owner?.display_name || "me")}</div>
        </div>
        <div class="pill">열기</div>
      `;
      el.addEventListener("click", () => openPlaylist(p.id, p.name));
      listEl.appendChild(el);
    }
  }

  async function openPlaylist(playlistId, playlistName) {
    const data = await sFetch(`/playlists/${playlistId}/tracks?limit=100`);
    const tracks = (data.items || [])
      .map(i => i.track)
      .filter(Boolean)
      .map(t => ({
        title: `${t.name} - ${t.artists?.map(a=>a.name).join(", ")}`,
        query: `${t.name} ${t.artists?.[0]?.name || ""}`,
      }));
    if (!tracks.length) {
      alert("이 플레이리스트에 트랙이 없습니다.");
      return;
    }
    currentQueue = [];
    for (const t of tracks) {
      const v = await ytSearchFirst(t.query);
      if (v) currentQueue.push({
        title: t.title,
        channel: v.snippet?.channelTitle || "",
        videoId: v.id?.videoId
      });
    }
    if (!currentQueue.length) {
      alert("YouTube 검색 결과가 없습니다.");
      return;
    }
    currentIndex = 0;
    playCurrent();
    setNowPlayingSubtitle(`플레이리스트: ${playlistName}`);
  }

  async function loadPersonal() {
    const el = document.getElementById("personalList");
    el.innerHTML = "<div class='empty'>불러오는 중…</div>";
    let tracks = [];
    try {
      const top = await sFetch("/me/top/tracks?limit=20&time_range=short_term");
      tracks = (top.items || []).map(t => ({
        title: `${t.name} - ${t.artists?.map(a=>a.name).join(", ")}`,
        query: `${t.name} ${t.artists?.[0]?.name || ""}`,
      }));
    } catch(e) {}
    if (!tracks.length) {
      try {
        const recent = await sFetch("/me/player/recently-played?limit=20");
        tracks = (recent.items || []).map(i => i.track).filter(Boolean).map(t => ({
          title: `${t.name} - ${t.artists?.map(a=>a.name).join(", ")}`,
          query: `${t.name} ${t.artists?.[0]?.name || ""}`,
        }));
      } catch(e) {}
    }
    if (!tracks.length) {
      el.innerHTML = "<div class='empty'>개인화 항목을 불러오지 못했습니다.</div>";
      return;
    }
    el.innerHTML = "";
    for (const t of tracks) {
      const div = document.createElement("div");
      div.className = "item";
      div.innerHTML = `
        <div class="thumb">♪</div>
        <div class="meta">
          <div class="name">${escapeHtml(t.title)}</div>
          <div class="sub">YouTube로 검색 후 재생</div>
        </div>
        <div class="pill">재생</div>
      `;
      div.addEventListener("click", async () => {
        const v = await ytSearchFirst(t.query);
        if (!v) { alert("YouTube 검색 결과가 없습니다."); return; }
        currentQueue = [{ title: t.title, channel: v.snippet?.channelTitle || "", videoId: v.id?.videoId }];
        currentIndex = 0;
        playCurrent();
        setNowPlayingSubtitle("개인화 추천");
      });
      el.appendChild(div);
    }
  }

  // ===== YouTube 검색/재생 =====
  async function ytSearchFirst(query) {
    const url = new URL("https://www.googleapis.com/youtube/v3/search");
    url.searchParams.set("key", YT_API_KEY);
    url.searchParams.set("part", "snippet");
    url.searchParams.set("q", query);
    url.searchParams.set("type", "video");
    url.searchParams.set("videoCategoryId", "10"); // Music
    url.searchParams.set("maxResults", "1");
    try {
      const res = await fetch(url);
      if (!res.ok) return null;
      const data = await res.json();
      return (data.items && data.items[0]) || null;
    } catch (e) {
      console.warn(e); return null;
    }
  }
  async function ytSearchList(query, max = 12) {
    const url = new URL("https://www.googleapis.com/youtube/v3/search");
    url.searchParams.set("key", YT_API_KEY);
    url.searchParams.set("part", "snippet");
    url.searchParams.set("q", query);
    url.searchParams.set("type", "video");
    url.searchParams.set("videoCategoryId", "10");
    url.searchParams.set("maxResults", String(max));
    const res = await fetch(url);
    if (!res.ok) throw new Error("YouTube 검색 실패");
    return res.json();
  }

  function setNowPlayingTitle(t){ document.getElementById("nowPlaying").textContent = t || "재생 대기 중…"; }
  function setNowPlayingSubtitle(s){ document.getElementById("nowPlayingSub").textContent = s || ""; }

  function playCurrent() {
    if (currentIndex < 0 || currentIndex >= currentQueue.length) return;
    const cur = currentQueue[currentIndex];
    setNowPlayingTitle(cur.title);
    setNowPlayingSubtitle(cur.channel || "");
    if (ytPlayer && ytPlayer.loadVideoById) ytPlayer.loadVideoById(cur.videoId);
    else createPlayer(cur.videoId);
  }
  function nextTrack(){ if (currentIndex + 1 < currentQueue.length){ currentIndex++; playCurrent(); } }
  function prevTrack(){ if (currentIndex > 0){ currentIndex--; playCurrent(); } }

  // ===== 이벤트 =====
  document.getElementById("btnLogin").addEventListener("click", () => {
    // 서버 콜백이 인증 전체 전담 → 프런트는 /callback으로만 이동
    location.href = "/callback";
  });
  document.getElementById("btnRefresh").addEventListener("click", () => {
    if (!getToken()) { alert("먼저 로그인해 주세요."); return; }
    loadPlaylists().catch(err => alert(err.message));
    loadPersonal().catch(err => alert(err.message));
  });

  document.getElementById("btnYtSearch").addEventListener("click", async () => {
    const q = document.getElementById("ytQuery").value.trim();
    const box = document.getElementById("ytResults");
    if (!q) { box.innerHTML = "<div class='empty'>검색어를 입력해 주세요.</div>"; return; }
    box.innerHTML = "<div class='empty'>검색 중…</div>";
    try {
      const data = await ytSearchList(q, 12);
      const items = data.items || [];
      if (!items.length) { box.innerHTML = "<div class='empty'>검색 결과 없음</div>"; return; }
      box.innerHTML = "";
      items.forEach(v => {
        const title = v.snippet?.title || "(제목 없음)";
        const channel = v.snippet?.channelTitle || "";
        const vid = v.id?.videoId;
        const el = document.createElement("div");
        el.className = "item";
        el.innerHTML = `
          <div class="thumb"><img src="https://i.ytimg.com/vi/${vid}/mqdefault.jpg" style="width:100%;height:100%;object-fit:cover;border-radius:8px;" /></div>
          <div class="meta">
            <div class="name">${escapeHtml(title)}</div>
            <div class="sub">${escapeHtml(channel)}</div>
          </div>
          <div class="pill">재생</div>
        `;
        el.addEventListener("click", () => {
          currentQueue = [{ title, channel, videoId: vid }];
          currentIndex = 0;
          playCurrent();
          setNowPlayingSubtitle("YouTube 검색");
        });
        box.appendChild(el);
      });
    } catch (e) {
      box.innerHTML = `<div class='empty danger'>오류: ${escapeHtml(e.message || String(e))}</div>`;
    }
  });

  // ===== YouTube IFrame API =====
  function createPlayer(videoId) {
    if (window.YT && YT.Player) {
      ytPlayer = new YT.Player("player", {
        videoId,
        playerVars: { autoplay: 1, controls: 1 },
        events: {
          onReady: (e) => { e.target.playVideo(); },
          onStateChange: (e) => { if (e.data === YT.PlayerState.ENDED) nextTrack(); }
        }
      });
    } else {
      loadYouTubeAPI(() => createPlayer(videoId));
    }
  }
  function loadYouTubeAPI(cb) {
    if (window._ytLoading) { window._ytCallbacks.push(cb); return; }
    if (window.YT && YT.Player) { cb(); return; }
    window._ytLoading = true;
    window._ytCallbacks = [cb];
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    window.onYouTubeIframeAPIReady = function() {
      window._ytCallbacks.forEach(fn => fn());
      window._ytCallbacks = [];
    }
    document.head.appendChild(tag);
  }

  // ===== 보조 =====
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // ===== 초기 부트 =====
  (function init() {
    // 1) /callback에서 돌아오며 붙은 토큰 회수(해시/쿼리)
    readTokenFromUrl();

    // 2) postMessage로 토큰을 받을 수도 있음(팝업 구조 지원)
    window.addEventListener("message", (ev) => {
      // 실제 서비스에서는 ev.origin 검증을 반드시 하세요.
      if (ev.data && ev.data.spotify_access_token) {
        sessionStorage.setItem("spotify_access_token", ev.data.spotify_access_token);
        spotifyToken = ev.data.spotify_access_token;
        loadPlaylists().catch(console.warn);
        loadPersonal().catch(console.warn);
      }
    });

    // 3) 토큰 존재 시 데이터 로드, 없으면 /callback으로 위임
    if (getToken()) {
      loadPlaylists().catch(err => {
        console.warn(err);
        if (String(err.message || "").includes("토큰 만료")) {
          alert("세션이 만료되어 다시 로그인해 주세요.");
          location.href = "/callback";
        }
      });
      loadPersonal().catch(console.warn);
    } else {
      // 자동 위임: 프런트는 인증 흐름에 관여하지 않음
      location.href = "/callback";
    }
  })();
</script>
</body>
</html>
