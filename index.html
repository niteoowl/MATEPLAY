<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stream.io – 비디오 플랫폼</title>
  <style>
    /* 기본 테마 및 변수 */
    :root{
      --bg:#0f0f0f;
      --bg-elev:#181818;
      --text:#f1f1f1;
      --text-dim:#bdbdbd;
      --card:#121212;
      --card-hover:#1a1a1a;
      --accent:#e11d48; /* 포인트 컬러 */
      --stroke:#2a2a2a;
      --chip-bg:#1f1f1f;
      --chip-text:#e5e5e5;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Pretendard,Apple SD Gothic Neo,Noto Sans KR,sans-serif}
    a{color:inherit;text-decoration:none}

    /* 레이아웃 */
    .app{display:grid;grid-template-columns:72px 1fr;grid-template-rows:56px 1fr;grid-template-areas:
      "topbar topbar"
      "sidebar main";min-height:100dvh}
    @media (max-width:960px){.app{grid-template-columns:56px 1fr}}
    
    /* 상단바 및 검색 */
    .topbar{grid-area:topbar;display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid var(--stroke);background:var(--bg-elev);position:sticky;top:0;z-index:30}
    .menu-btn{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;border:1px solid var(--stroke);background:transparent;cursor:pointer}
    .menu-btn:hover{background:#1b1b1b}
    .brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:0.2px}
    .brand-dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
    .search{flex:1;display:flex;align-items:center;gap:8px;max-width:760px;margin:0 auto}
    .search input{flex:1;height:40px;border:1px solid var(--stroke);background:var(--bg);color:var(--text);border-radius:20px 0 0 20px;padding:0 14px;font-size:14px;outline:none}
    .search button{height:40px;padding:0 14px;border:1px solid var(--stroke);border-left:none;background:var(--chip-bg);color:var(--text);border-radius:0 20px 20px 0;cursor:pointer}
    .search .mic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--bg);border:1px solid var(--stroke);margin-left:8px}
    .actions{display:flex;align-items:center;gap:8px}
    .icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--stroke);background:transparent;cursor:pointer}
    .icon-btn:hover{background:#1b1b1b}

    /* 사이드바 */
    .sidebar{grid-area:sidebar;border-right:1px solid var(--stroke);background:var(--bg);padding:8px 6px;position:sticky;top:56px;height:calc(100dvh - 56px);overflow:auto;z-index:20}
    .nav{display:flex;flex-direction:column;gap:6px}
    .nav a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:10px;color:var(--text-dim);font-size:11px}
    .nav a:hover{background:#171717;color:var(--text)}
    .nav .active{background:var(--bg-elev);color:var(--text);border:1px solid var(--stroke)}

    /* 카테고리 칩 */
    .filters{position:sticky;top:56px;z-index:20;background:var(--bg-elev);border-bottom:1px solid var(--stroke)}
    .chips{display:flex;gap:8px;overflow:auto;padding:10px 16px}
    .chip{white-space:nowrap;padding:8px 12px;border-radius:999px;background:var(--chip-bg);color:var(--chip-text);border:1px solid var(--stroke);font-size:13px;cursor:pointer}
    .chip.active{background:#ffffff; color:#111; border-color:transparent}
    .chip:hover{background:#2a2a2a}

    /* 메인 (홈 그리드 뷰) */
    .main{grid-area:main}
    .content{padding:16px}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;min-height:400px;place-items:stretch}
    @media (max-width:1280px){.grid{grid-template-columns:repeat(3,1fr)}}
    @media (max-width:960px){.grid{grid-template-columns:repeat(2,1fr)}}
    @media (max-width:640px){.grid{grid-template-columns:1fr}}

    /* 카드 (홈 그리드 및 관련 동영상) */
    .card{background:var(--card);border:1px solid var(--stroke);border-radius:14px;overflow:hidden;transition:transform .15s ease, background .15s ease, box-shadow .15s ease; cursor:pointer; display:block;}
    .card:hover{transform:translateY(-2px);background:var(--card-hover);box-shadow:0 8px 24px rgba(0,0,0,.25)}
    .thumb-wrap{position:relative;aspect-ratio:16/9;background:#0a0a0a;overflow:hidden}
    .thumb-wrap img{width:100%;height:100%;object-fit:cover;transition:opacity .3s ease} 
    .badge{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.7);color:#fff;font-size:12px;padding:4px 6px;border-radius:6px;border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(4px)}
    .meta{display:flex;gap:12px;padding:12px}
    .avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#343434,#1c1c1c);border:1px solid var(--stroke);flex:0 0 auto}
    .info{min-width:0}
    .title{font-weight:600;line-height:1.35;margin:0 0 6px;font-size:15px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical} 
    .sub{color:var(--text-dim);font-size:13px}
    
    /* 로딩 인디케이터 (이전과 동일) */
    .skeleton-card {background: var(--card);border: 1px solid var(--stroke);border-radius: 14px;overflow: hidden;animation: loading-pulse 1.5s infinite ease-in-out;}
    .skeleton-thumb {aspect-ratio: 16/9;background: #1e1e1e;}
    .skeleton-meta {display: flex;gap: 12px;padding: 12px;}
    .skeleton-avatar {width: 36px;height: 36px;border-radius: 50%;background: #1e1e1e;}
    .skeleton-line {height: 14px;background: #1e1e1e;border-radius: 4px;margin-bottom: 6px;}
    .skeleton-title { width: 90%; }
    .skeleton-subtitle { width: 60%; }
    @keyframes loading-pulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
    }

    /* --- 시청 페이지 레이아웃 (Watch View) --- */
    #watch-page {
        padding: 24px 16px;
        max-width: none; /* 전체 폭 사용 */
    }
    .watch-layout {
        display: grid;
        gap: 24px;
        grid-template-columns: 1fr 320px; /* 메인 플레이어 (1fr)와 관련 동영상 (320px) */
    }
    .player-container {
        border-radius: 12px;
        overflow: hidden;
        margin-bottom: 16px;
        background: #000;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    /* 비디오 iframe 컨테이너 (16:9 비율 유지) */
    .video-embed-wrap {
        position: relative;
        width: 100%;
        padding-top: 56.25%; /* 16:9 비율 */
    }
    .video-embed-wrap iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: none;
    }
    
    /* 관련 동영상 스타일 */
    #related-videos .card {
        display: flex; /* 가로로 나열 */
        padding: 0;
        margin-bottom: 12px;
        border: none;
        background: transparent;
    }
    #related-videos .card:hover {
        transform: none;
        background: var(--card-hover);
        box-shadow: none;
    }
    #related-videos .thumb-wrap {
        width: 168px; /* 썸네일 너비 고정 */
        height: 94px; /* 16:9 비율 (168/16 * 9) */
        flex-shrink: 0;
        border-radius: 8px;
    }
    #related-videos .meta {
        padding: 8px 12px;
        gap: 0;
        flex-direction: column;
    }
    #related-videos .title {
        font-size: 14px;
        font-weight: 500;
        margin: 0;
        -webkit-line-clamp: 2;
    }
    #related-videos .sub {
        font-size: 12px;
        margin-top: 4px;
        color: var(--text-dim);
    }
    #related-videos .avatar { display: none; } /* 관련 동영상 카드에서는 아바타 숨김 */

    /* 모바일 반응형 (시청 페이지) */
    @media (max-width: 1024px) {
        .watch-layout {
            grid-template-columns: 1fr; /* 플레이어와 관련 동영상을 수직으로 배치 */
        }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- 상단 바 -->
    <header class="topbar" role="banner" aria-label="상단 탐색">
      <button class="menu-btn" aria-label="메뉴 열기">☰</button>
      <a class="brand" href="#" aria-label="홈으로">
        <span class="brand-dot" aria-hidden="true"></span>
        <span>Stream<span style="color:var(--accent)">.io</span></span>
      </a>
      <form class="search" role="search" aria-label="검색">
        <input id="search-input" type="search" placeholder="동영상, 채널, 플레이리스트 검색" aria-label="검색어 입력" />
        <button type="submit" aria-label="검색">검색</button>
        <div class="mic" aria-label="음성 검색">🎤</div>
      </form>
      <div class="actions" aria-label="사용자 동작">
        <button class="icon-btn" aria-label="업로드">⤴︎</button>
        <button class="icon-btn" aria-label="알림">🔔</button>
        <button class="icon-btn" aria-label="프로필">👤</button>
      </div>
    </header>

    <!-- 사이드바 -->
    <aside class="sidebar" role="navigation" aria-label="사이드 탐색">
      <nav class="nav">
        <a href="#home" class="active" aria-current="page" data-view="home">홈</a>
        <a href="#shorts" data-view="shorts">Shorts</a>
        <a href="#subscriptions" data-view="subscriptions">구독</a>
        <a href="#library" data-view="library">보관함</a>
        <a href="#history" data-view="history">내 기록</a>
      </nav>
    </aside>

    <!-- 필터 칩 (홈 뷰에서만 보임) -->
    <div id="filter-chips" class="filters">
      <div class="chips" role="tablist" aria-label="카테고리">
        <button class="chip active" data-category="전체" role="tab" aria-selected="true">전체</button>
        <button class="chip" data-category="음악" role="tab">음악</button>
        <button class="chip" data-category="게임" role="tab">게임</button>
        <button class="chip" data-category="뉴스" role="tab">뉴스</button>
        <button class="chip" data-category="실시간" role="tab">실시간</button>
        <button class="chip" data-category="학습" role="tab">학습</button>
        <button class="chip" data-category="스포츠" role="tab">스포츠</button>
        <button class="chip" data-category="영화" role="tab">영화</button>
        <button class="chip" data-category="테크" role="tab">테크</button>
        <button class="chip" data-category="여행" role="tab">여행</button>
      </div>
    </div>

    <!-- 메인 콘텐츠 영역 -->
    <main class="main" role="main">
        <!-- 1. 홈/검색 결과 뷰 -->
        <section id="home-view" class="content">
            <div class="grid" id="video-grid">
              <!-- 비디오 카드들이 동적으로 로드됩니다. -->
            </div>
        </section>

        <!-- 2. 시청 페이지 뷰 -->
        <section id="watch-page-view" class="content hidden">
            <div class="watch-layout mx-auto max-w-7xl">
                <!-- 메인 플레이어 영역 -->
                <div id="player-column">
                    <div id="player-container" class="player-container">
                        <div id="video-embed-wrap" class="video-embed-wrap">
                            <!-- 여기에 비디오 iframe이 삽입됩니다. -->
                        </div>
                    </div>
                    <!-- 비디오 상세 정보 -->
                    <div id="video-details">
                        <h1 class="text-2xl font-bold mb-3" id="watch-video-title">선택된 비디오 제목</h1>
                        <div class="flex items-center gap-4 border-b border-t border-gray-700 py-3 mb-4">
                            <div class="avatar"></div>
                            <div class="flex-1">
                                <p class="font-semibold text-base" id="watch-channel-title">채널 이름</p>
                                <p class="text-sm text-text-dim">구독자 123만명 (가상 데이터)</p>
                            </div>
                            <button class="bg-white text-black font-bold px-4 py-2 rounded-full hover:bg-gray-200 transition-colors">구독</button>
                        </div>
                        <div id="watch-video-description" class="text-sm text-text-dim max-h-24 overflow-hidden">
                            <!-- 여기에 설명이 들어갑니다. -->
                        </div>
                    </div>
                </div>

                <!-- 관련 동영상 영역 -->
                <div id="related-column">
                    <h2 class="text-xl font-bold mb-4">관련 동영상</h2>
                    <div id="related-videos">
                        <!-- 관련 비디오 카드들이 동적으로 로드됩니다. -->
                    </div>
                </div>
            </div>
        </section>
    </main>
  </div>


  <script>
    // YouTube Data API Key - 클라이언트 측 노출에 주의하십시오.
    const YOUTUBE_API_KEY = "AIzaSyAIhw6pfhduLDZRdv5FqzddSBqHjMQQzEE";
    const SEARCH_URL = "https://www.googleapis.com/youtube/v3/search";
    
    // DOM 요소
    const searchForm = document.querySelector('.search');
    const searchInput = document.getElementById('search-input');
    const filterChips = document.getElementById('filter-chips');

    const homeView = document.getElementById('home-view');
    const videoGrid = document.getElementById('video-grid');
    const watchPageView = document.getElementById('watch-page-view');
    const videoEmbedWrap = document.getElementById('video-embed-wrap');
    const relatedVideosContainer = document.getElementById('related-videos');

    // 비디오 정보 임시 저장소 (API 호출 시 데이터 저장)
    let videoDataCache = {};

    
    // --- 유틸리티 및 UI 함수 ---

    // 커스텀 알림 메시지 함수 (alert() 대체)
    function alertMessage(message, type) {
        const alertBox = document.createElement('div');
        alertBox.className = `fixed top-4 right-4 p-4 rounded-xl shadow-2xl text-white ${type === 'success' ? 'bg-green-600' : 'bg-red-600'} z-50 transition-all duration-300`;
        alertBox.textContent = message;
        document.body.appendChild(alertBox);

        setTimeout(() => {
            alertBox.remove();
        }, 3000);
    }

    // 로딩 스켈레톤 카드 렌더링
    function renderSkeletons(targetElement, count, isRelated = false) {
        let html = '';
        for (let i = 0; i < count; i++) {
            if (isRelated) {
                // 관련 동영상 스켈레톤 (가로 레이아웃)
                html += `
                    <div class="skeleton-card" style="display:flex; padding:0; background:transparent;">
                        <div class="skeleton-thumb" style="width:168px; height:94px; border-radius:8px;"></div>
                        <div class="skeleton-meta" style="flex-direction:column; padding-top:8px;">
                            <div class="info w-full">
                                <div class="skeleton-line" style="width:180px;"></div>
                                <div class="skeleton-line" style="width:100px; height:12px;"></div>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                // 홈 그리드 스켈레톤 (정사각형 레이아웃)
                html += `
                    <div class="skeleton-card">
                        <div class="skeleton-thumb"></div>
                        <div class="skeleton-meta">
                            <div class="skeleton-avatar"></div>
                            <div class="info w-full">
                                <div class="skeleton-line skeleton-title"></div>
                                <div class="skeleton-line skeleton-subtitle"></div>
                            </div>
                        </div>
                    </div>
                `;
            }
        }
        targetElement.innerHTML = html;
    }

    // 비디오 카드 HTML 생성 함수
    function createVideoCardHtml(item, isRelated = false) {
        const videoId = item.id.videoId;
        const title = item.snippet.title;
        const channelTitle = item.snippet.channelTitle;
        const thumbnailUrl = isRelated ? item.snippet.thumbnails.high.url : item.snippet.thumbnails.medium.url;

        let cardClasses = "card";
        let metaHtml = '';

        if (isRelated) {
            // 관련 동영상 카드 스타일
            cardClasses = "card"; // 기본 스타일 유지
            metaHtml = `
                <div class="meta">
                    <div class="info">
                        <h3 class="title">${title}</h3>
                        <div class="sub">
                            <span>${channelTitle}</span>
                        </div>
                    </div>
                </div>
            `;
        } else {
            // 홈 그리드 카드 스타일
            metaHtml = `
                <div class="meta">
                    <div class="avatar" aria-hidden="true"></div>
                    <div class="info">
                        <h3 class="title">${title}</h3>
                        <div class="sub">
                            <span>${channelTitle}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        return `
            <a href="?v=${videoId}" class="${cardClasses}" data-video-id="${videoId}">
                <div class="thumb-wrap" aria-label="동영상 썸네일">
                    <img src="${thumbnailUrl}" alt="${title}" onerror="this.onerror=null;this.src='https://placehold.co/${isRelated ? '168x94' : '320x180'}/121212/888888?text=No+Image';" class="w-full h-full object-fit-cover">
                    <span class="badge" aria-label="재생시간">--:--</span> 
                </div>
                ${metaHtml}
            </a>
        `;
    }

    // --- 뷰 전환 (라우팅) 함수 ---

    function showHomeView() {
        watchPageView.classList.add('hidden');
        filterChips.classList.remove('hidden');
        homeView.classList.remove('hidden');
        document.body.style.overflow = ''; 

        // URL에서 ?v= 파라미터 제거 (홈으로 이동)
        if (window.location.search.includes('v=')) {
            history.pushState(null, '', window.location.origin + window.location.pathname);
        }
    }

    async function showWatchView(videoId) {
        homeView.classList.add('hidden');
        filterChips.classList.add('hidden');
        watchPageView.classList.remove('hidden');
        window.scrollTo(0, 0); // 페이지 상단으로 스크롤

        // 1. 메인 플레이어 임베드 및 상세 정보 표시 (캐시 사용)
        loadMainPlayer(videoId);

        // 2. 관련 동영상 로드 (현재 검색어 재사용)
        await fetchRelatedVideos(searchInput.value || "인공지능 최신 뉴스", videoId);
    }
    
    // --- 비디오 로드 및 API 호출 ---

    // 메인 플레이어 로드
    function loadMainPlayer(videoId) {
        // 비디오 자동 재생 및 관련 동영상 숨김 설정
        const embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1`;
        const iframeHtml = `
            <iframe 
                src="${embedUrl}" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen 
                title="YouTube video player: ${videoId}">
            </iframe>
        `;
        
        videoEmbedWrap.innerHTML = iframeHtml;
        
        // 상세 정보 (캐시된 정보 사용)
        const item = videoDataCache[videoId];
        if (item) {
            document.getElementById('watch-video-title').textContent = item.snippet.title;
            document.getElementById('watch-channel-title').textContent = item.snippet.channelTitle;
            document.getElementById('watch-video-description').textContent = item.snippet.description || "이 동영상은 설명이 제공되지 않았습니다.";
        } else {
            // 캐시에 없는 경우 기본값 표시
            document.getElementById('watch-video-title').textContent = videoId;
            document.getElementById('watch-channel-title').textContent = "정보를 가져올 수 없음";
            document.getElementById('watch-video-description').textContent = "비디오 상세 정보를 가져오는 데 실패했습니다.";
        }
    }

    // 홈 뷰의 비디오 목록을 가져오는 함수
    async function fetchHomeVideos(query) {
        // 로딩 스켈레톤 표시
        renderSkeletons(videoGrid, 12); 

        const apiUrl = `${SEARCH_URL}?key=${YOUTUBE_API_KEY}&part=snippet&q=${encodeURIComponent(query)}&type=video&maxResults=16&regionCode=KR`;

        try {
            const response = await fetch(apiUrl);
            if (!response.ok) {
                throw new Error("API 호출 오류");
            }
            const data = await response.json();
            
            // 데이터 캐시 및 렌더링
            videoDataCache = {};
            data.items.forEach(item => {
                if (item.id.kind === 'youtube#video') {
                    videoDataCache[item.id.videoId] = item;
                }
            });

            videoGrid.innerHTML = '';
            data.items.forEach(item => {
                if (item.id.kind === 'youtube#video') {
                    videoGrid.insertAdjacentHTML('beforeend', createVideoCardHtml(item, false));
                }
            });

            alertMessage(`'${query}'에 대한 검색 결과 ${data.items.filter(i => i.id.kind === 'youtube#video').length}개를 로드했습니다.`, "success");

        } catch (error) {
            console.error("API 호출 중 오류 발생:", error);
            videoGrid.innerHTML = '<div class="text-center col-span-full py-10 text-2xl text-red-500">API 호출에 실패했습니다.<br>키 유효성 또는 일일 할당량을 확인하세요.</div><p class="text-center text-red-400">오류 메시지: ' + error.message + '</p>';
            alertMessage("API 호출 실패. 콘솔을 확인하세요.", "error");
        }
    }

    // 관련 비디오 목록을 가져오는 함수 (같은 검색어를 사용하여 '관련' 동영상처럼 보이게 처리)
    async function fetchRelatedVideos(query, excludeVideoId) {
        renderSkeletons(relatedVideosContainer, 6, true);
        
        // 관련 동영상 API는 별도 파라미터가 필요하지만, 간단히 같은 검색어로 다시 호출하여 다른 목록을 가져옴
        // 실제 YouTube API에서는 relatedToVideoId 파라미터를 사용해야 정확한 관련 동영상을 얻습니다.
        const apiUrl = `${SEARCH_URL}?key=${YOUTUBE_API_KEY}&part=snippet&q=${encodeURIComponent(query)}&type=video&maxResults=10&regionCode=KR&maxResults=6`; 
        
        try {
            const response = await fetch(apiUrl);
            const data = await response.json();

            relatedVideosContainer.innerHTML = '';
            let count = 0;

            data.items.forEach(item => {
                // 현재 시청 중인 비디오 제외 및 비디오 유형만 포함
                if (item.id.kind === 'youtube#video' && item.id.videoId !== excludeVideoId && count < 6) {
                    relatedVideosContainer.insertAdjacentHTML('beforeend', createVideoCardHtml(item, true));
                    count++;
                }
            });

            if (count === 0) {
                relatedVideosContainer.innerHTML = '<p class="text-sm text-center text-text-dim pt-4">다른 관련 동영상을 찾을 수 없습니다.</p>';
            }

        } catch (error) {
            console.error("관련 동영상 API 호출 중 오류 발생:", error);
            relatedVideosContainer.innerHTML = '<p class="text-sm text-red-400 pt-4">관련 동영상 로드 실패.</p>';
        }
    }


    // --- 라우팅 및 이벤트 핸들러 ---

    // URL 변경에 따라 뷰를 전환하는 메인 라우팅 핸들러
    function handleRouting() {
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('v');

        if (videoId) {
            showWatchView(videoId);
        } else {
            showHomeView();
        }
    }

    // 검색 폼 제출 이벤트 처리
    searchForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const query = searchInput.value.trim();
        if (query) {
            // URL을 홈으로 설정하고 검색어는 주소에서 제거 (단일 파일 제한)
            history.pushState(null, '', window.location.origin + window.location.pathname);
            handleRouting(); // 홈 뷰로 전환
            fetchHomeVideos(query);
        } else {
            alertMessage("검색어를 입력해주세요.", "error");
        }
    });

    // 비디오 카드 클릭 이벤트 위임 (시청 페이지로 이동)
    // 이벤트 리스너를 body에 추가하여 모든 <a> 태그의 클릭을 가로챕니다.
    document.body.addEventListener('click', (e) => {
        // 비디오 카드(<a> 태그)를 클릭했는지 확인
        const link = e.target.closest('a[data-video-id]');
        if (link) {
            e.preventDefault(); 
            const videoId = link.dataset.videoId;
            if (videoId) {
                // URL 업데이트 및 라우팅 함수 실행
                history.pushState(null, '', `?v=${videoId}`);
                handleRouting();
            }
        }
    });

    // 브라우저 뒤로/앞으로 버튼 처리
    window.addEventListener('popstate', handleRouting);

    // 페이지 로드 시 초기 검색 실행 및 라우팅 시작
    window.onload = () => {
        const initialQuery = "최신 AI 기술 동향"; 
        searchInput.value = initialQuery;
        
        handleRouting(); // 현재 URL에 따라 뷰 초기화
        
        // 홈 뷰로 시작하는 경우에만 초기 검색 실행
        if (!window.location.search.includes('v=')) {
            fetchHomeVideos(initialQuery);
        }
    };
  </script>
</body>
</html>
